let renderBekliyor = false;

function yaziliyorMu() {
  const e = document.activeElement;
  return !!e && (e.tagName === 'INPUT' || e.tagName === 'TEXTAREA' || e.tagName === 'SELECT');
}

function scheduleRender() {
  if (document.getElementById('modalOverlay') || yaziliyorMu()) {
    renderBekliyor = true;
    return;
  }
  render();
}

function bekleyenRenderiBosalt() {
  if (!renderBekliyor) return;
  renderBekliyor = false;
  render();
}

// Nav
document.querySelectorAll('nav.bottom button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.bottom button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    openDepotDetail = null;
    depotSearchQuery = '';
    // Ekran burada zaten guncelleniyor: bekleyen render borcu KAPANIR.
    // Bayrak dusurulmezse, arama kutusunda yazarken gelen veri onu kurmusken
    // sekmeye tiklamak bayragi true birakiyor ve sonraki herhangi bir
    // focusout gereksiz bir ekstra render tetikliyordu.
    renderBekliyor = false;
    render();
  });
});

// ===== Delege edilmis olay dinleyicileri =====
// Veri tasiyan isleyiciler satir ici onclick yerine data-* ozniteliklerinden okunur.
// Satir ici isleyicide tarayici once HTML varliklarini cozer, cozulmus metin sonra JS
// kaynagi olarak yorumlanir; boylece escapeHtml'in kapattigini JS seviyesi geri acardi.
// dataset uzerinden okunan deger ise hicbir zaman koda donusmez.
// Dinleyici document uzerinde: hem #app icerigi (depo kartlari, urun satirlari, gecmis,
// ayarlar) hem de document.body'ye eklenen modal overlay (otomatik tamamlama) kapsanir.
document.addEventListener('click', olay => {
  const kaynak = olay.target;
  if (!kaynak || typeof kaynak.closest !== 'function') return;
  const hedef = kaynak.closest('[data-eylem]');
  if (!hedef) return;
  const eylem = hedef.dataset.eylem;
  if (eylem === 'depoAc') openDepot(hedef.dataset.depo);
  else if (eylem === 'urunDokun') quickTap(hedef.dataset.depo, hedef.dataset.kod);
  else if (eylem === 'geriAl') geriAl(hedef.dataset.tx);
  else if (eylem === 'depoSil') depoSil(hedef.dataset.depo);
  else if (eylem === 'urunSec') pickProduct(hedef.dataset.kod);
  else if (eylem === 'kullaniciCikis') kullaniciCikisYap();
  else if (eylem === 'kullaniciEkle') kullaniciEkle();
  else if (eylem === 'kullaniciDuzenle') kullaniciDuzenle(hedef.dataset.kullanici);
  else if (eylem === 'kullaniciSil') kullaniciSil(hedef.dataset.kullanici);
});

document.addEventListener('change', olay => {
  const kaynak = olay.target;
  if (!kaynak || typeof kaynak.closest !== 'function') return;
  const hedef = kaynak.closest('[data-eylem="depoAdiDegistir"]');
  if (!hedef) return;
  renameDepot(hedef.dataset.depo, hedef.value);
});

document.addEventListener('focusout', bekleyenRenderiBosalt);

// ===== Yerel önbellek (internet olmadan da açılabilsin) =====
function loadCache() {
  try {
    const d = localStorage.getItem('cache_depots');
    const s = localStorage.getItem('cache_stock');
    const t = localStorage.getItem('cache_tx');
    const c = localStorage.getItem('cache_custom');
    const u = localStorage.getItem('cache_users');
    if (d) depots = {...DEFAULT_DEPOTS, ...JSON.parse(d)};
    if (s) stock = JSON.parse(s);
    if (t) transactions = JSON.parse(t);
    if (c) customProducts = JSON.parse(c);
    if (u) users = JSON.parse(u);
  } catch(e) {}
}
// Onbellege sigmayan kayitlar kirpilirken atilanlar en ESKILER olmali.
// transactions dizisi KARISIK sirali: Firebase dinleyicisi onu eskiden yeniye
// dolduruyor (Object.keys = push anahtari sirasi), yeni cevrimdisi kayit ise
// unshift ile basa ekleniyor. Duz slice(0,300) bu yuzden en eski 299 kaydi
// tutup EN YENI sunucu kaydini atiyordu; her cevrimdisi giriste bir tane daha
// dusuyordu. ts'ye gore azalan siralanip kirpilir.
// KOPYA uzerinde calisilir: canli dizinin sirasina baska kod dayaniyor olabilir,
// yerinde siralama onu sessizce degistirirdi.
function enYeniIslemler(sinir) {
  return transactions
    .slice()
    .sort((a, b) => (Number(b && b.ts) || 0) - (Number(a && a.ts) || 0))
    .slice(0, sinir);
}

function saveCache() {
  try {
    localStorage.setItem('cache_depots', JSON.stringify(depots));
    localStorage.setItem('cache_stock', JSON.stringify(stock));
    localStorage.setItem('cache_tx', JSON.stringify(enYeniIslemler(300)));
    localStorage.setItem('cache_custom', JSON.stringify(customProducts));
    localStorage.setItem('cache_users', JSON.stringify(users));
  } catch(e) {
    // Onbellek yazilamadi - ayni localStorage kotasini paylasan kuyruk da
    // yazamayacak demektir. Sessizce yutmak yerine zaten var olan "cihaz
    // depolamasi dolu" mekanizmasi tetiklenir: kullanici taniyor oldugu ayni
    // kirmizi seridi gorur, senkronizasyon durur (kuyrukYazilabilirMi() zaten
    // ayni sebepten calismayacakti, bu yalnizca daha erken haber verir).
    console.warn('onbellek yazilamadi', e);
    senkronizasyonuDurdur();
  }
}
loadCache();

// Uygulama icerigi PIN karari VERILENE KADAR kullaniciya acilmaz.
// Her dalda render() ile onu orten ekran ayni senkron blokta calisir; arada
// icerigin tiklanabildigi bir pencere olusmaz.
if (cihazDogrulanmisMi()) {
  render();                          // cihaz + kullanici taze dogrulanmis: gecikme yok
  navYetkisiniUygula();
} else if (Object.keys(users).length > 0) {
  render();
  navYetkisiniUygula();
  pinEkraniniGoster();                // onbellekte en az bir kullanici var: PIN sorulabilir
} else {
  // Onbellekte hic kullanici yok — sunucuya sorulur. Beklerken icerik perdeyle ortulur.
  pinPerdesiniGoster();
  kullaniciSunucuKontrolu().then(durum => {
    // try/finally SART: render() ya da pinEkraniniGoster() istisna atarsa
    // perde hic kaldirilmaz ve kullanici kalici mavi ekranda kalir — PWA'da
    // adres cubugu olmadigi icin cikisi da zor. Bu, C4'un ta kendisinin
    // sekli. Perde HER kosulda kalkar; istisna yine de yukari gider.
    try {
      render();
      navYetkisiniUygula();
      if (!cihazDogrulanmisMi()) {
        if (durum === 'var') pinEkraniniGoster();
        // 'yok' (hic kullanici tanimli degil) ya da 'bilinmiyor' (sunucuya
        // sorulamadi): sorulacak bir PIN yok — KILITLEME, uygulamayi ac.
        // mevcutKullanici null kalir, Gorev 4'teki yetki kontrolu bunu
        // en dusuk (personel) yetkiye esdeger sayar.
      }
    } finally {
      // Perde en son kaldirilir ki PIN ekrani eklenirken arada icerik gorunmesin.
      pinPerdesiniKaldir();
    }
  }).catch(e => {
    // Sozun kendisi reddedilirse de perde kalmasin.
    console.warn('PIN kapisi hata verdi', e);
    pinPerdesiniKaldir();
  });
}

// ===== Bekleyen işlem kuyruğu (internet yokken kaydedilenler) =====
function getQueue() {
  try { return JSON.parse(localStorage.getItem('pending_queue') || '[]'); } catch(e) { return []; }
}
// Basarisizligi ISTISNA yerine DONUS DEGERI ile bildirir: kuyruk ilerleme
// isaretleri kalicilastirilamadiginda cagiran taraf bunu gorup senkronizasyonu
// durdurabilsin diye.
function setQueue(q) {
  try {
    localStorage.setItem('pending_queue', JSON.stringify(q));
    return true;
  } catch (e) {
    return false;   // QuotaExceededError vb.
  }
}

// Bu kuyruk turunda gerekecek EN BUYUK yazma kadar veriyi bir sonda anahtarina
// yazip hemen siler; amac, hicbir Firebase mutasyonuna girmeden ONCE ilerleme
// isaretini yazabilecegimizi bilmek.
//
// Neden gerekli: applyOne() once uygulaniyor, isaret sonra yaziliyor. Isaret
// yazilamazsa Firebase islemi coktan uygulanmis olur. depolamaDoldu yalnizca
// bellekte oldugu icin sayfa yenilenince false'a doner, kuyruk ogesi isaretsiz
// durur ve ayni delta yeniden baslatmada IKINCI KEZ uygulanir — sessiz ve kalici
// stok hatasi. Sonda, isaretleyemeyecegimiz bir deltayi hic uygulamamizi saglar.
//
// Neden sirayi ters cevirmedik: isareti applyOne'dan once yazmak, applyOne
// basarisiz oldugunda deltanin tamamen kaybolmasina yol acar; ayni sekilde
// _kaydedildi'yi push'tan once yazmak basarisiz push'u basarili sanmak olur.
// "Uygula sonra isaretle" dogru sira; eksik olan, on kosulun sinanmasiydi.
function kuyrukYazilabilirMi() {
  const SONDA = 'pending_queue_sonda';
  try {
    const deneme = getQueue();
    if (deneme.length) {
      // bu turda eklenebilecek TUM isaretler basa konur: gercek yazmanin
      // ihtiyac duyacagi boyutun ust siniri
      deneme[0] = { ...deneme[0], _fromUygulandi: true, _toUygulandi: true,
                    _stokUygulandi: true, _kaydedildi: true, _hataSayisi: 999999999 };
    }
    localStorage.setItem(SONDA, JSON.stringify(deneme));
    return true;
  } catch (e) {
    return false;   // QuotaExceededError vb.
  } finally {
    try { localStorage.removeItem(SONDA); } catch (e2) {}
  }
}

// Sonda yazmasi ile removeItem arasinda sekme kapanirsa anahtar kalir; kuyruk bir
// daha hic dolmazsa hicbir sey onu silmez ve tam da kotayi zorlayan senaryoda bir
// kuyruk kopyasi kadar yer yer. Acilista kosulsuz temizle.
try { localStorage.removeItem('pending_queue_sonda'); } catch (e) {}

// Kuyruk ilerleme isareti cihaza yazilamadi -> senkronizasyon durduruldu.
// Korukorune yeniden deneme ayni deltayi Firebase'e tekrar tekrar uygular
// (stok kacagi); veri yanlis olmaktansa senkronizasyon dursun ve gorunur olsun.
let depolamaDoldu = false;

function senkronizasyonuDurdur() {
  depolamaDoldu = true;
  updateOfflineBar();
}

// ===== Zehirli kuyruk ogesi: geri cekilme + gorunur uyari (I5) =====
// Kuyrugun basindaki oge kalici olarak reddedilirse (kural degisikligi, yetki
// kaybi, bozuk kayit) arkasindaki her sey bekler. Yerel stok applyDeltaLocal ile
// coktan degistigi icin BU cihaz dogru sayiyi gosterir, sunucu ve diger cihazlar
// eski sayida kalir — sessiz ve sinirsiz sapma.
//
// Karar: oge ASLA atilmaz (kayit silmek geri donussuzdur). Bunun yerine oge
// bazinda ardisik hata sayilir, yeniden deneme araligi kademeli acilir ve esik
// asilinca durum cubugu gecici mavi seritten AYIRT EDILEBILIR kalici bir uyariya
// doner: hangi islemin takildigini adiyla soyler.
const HATA_ESIGI = 5;             // bu kadar ardisik hatadan sonra kalici uyari
const GERI_CEKILME_TABAN = 5000;  // ilk yeniden deneme araligi
const GERI_CEKILME_UST_SINIR = 300000;  // 5 dk: sonsuza kadar buyumez, baglanti donunce makul surede toparlar

function geriCekilmeSuresi(hataSayisi) {
  const us = Math.min(Math.max(0, (Number(hataSayisi) || 1) - 1), 20);  // Math.pow tasmasini engelle
  return Math.min(GERI_CEKILME_TABAN * Math.pow(2, us), GERI_CEKILME_UST_SINIR);
}

// Geri cekilme kapisi: setInterval, 'online' olayi ve dogrudan cagrilar da bu
// zamani gozetmezse geri cekilmenin hicbir anlami kalmaz.
let sonrakiDenemeZamani = 0;

// Bir turu bitiren tek yol bitir()/hataOldu() idi. Firebase sozu HIC cozulmezse
// ("navigator.onLine true ama baglanti olu" — deponun standart hali) tur asili
// kalir: kilit birakilmaz, sayac artmaz, uyari cikmaz. Ornekler arasi kilit
// eklendikten sonra bu, yalnizca o sekmeyi degil ayni cihazdaki TUM ornekleri
// susturur. Tur zaman asimi, asili turu hataOldu yoluna dusurur.
const TUR_ZAMAN_ASIMI = 60000;   // baglanti saglamken bir yazma bunun yanina bile yaklasmaz

// Firebase'in GERCEK baglanti durumu (.info/connected). navigator.onLine yalnizca
// ag arayuzunu bilir. Bu ayrimi tur zaman asimi zorunlu kildi: baglanti oluyken
// baslatilan tur, SDK'nin giden kuyruguna yeniden baglaninca MUTLAKA uygulanacak
// bir yazma birakir. Zaman asimi kilidi birakip baska ornegin ayni ogeyi yeniden
// uygulamasina izin verseydi, baglanti dondugunde iki yazma da islenir ve stok
// iki kez degisirdi. Cozum: baglanti olu iken hic tur BASLATMAMAK. Boylece asili
// tek yazma vardir, o da cozuldugunde kendi bacak isaretini yazar ve ikinci kez
// uygulanmaz.
// Iyimser baslangic: dinleyici hic kurulamazsa davranis eskisi gibi kalir.
let firebaseBagli = true;

// TUR_ZAMAN_ASIMI'nin KENDI actigi yeni bir delik: bekci bir turu vazgectiginde
// o turun applyOne()/push() sozu RTDB SDK'sinin kendi ic kuyruguna dusmus
// olabilir — baglanti gercekten donunce SDK onu KENDILIGINDEN gonderir. Boyle
// bir zombi yazma varken kuyruktaki AYNI ogeyi yeniden isleyen HERHANGI bir
// tetikleyici (reconnect kisayolu, hataOldu'nun kendi geri cekilme
// zamanlayicisi, setInterval, dogrudan bir kullanici islemi) delta'yi ikinci
// kez uygulayabilir. Riski TAMAMEN KAPATMAZ — zombi yazmanin gercekten
// cozulup cozulmedigini ogrenmenin ucuz bir yolu yok (stok bir sayac, ozel
// bir kayit degil) — yalnizca bu SABIT, TAHMINI pencere kadar DARALTIR.
//
// Bayrak BELLEKTE tutulur ama pencere de localStorage'a yazilir: kuyruk ve
// ornekler arasi kilit paylasilir (bkz. kiralamaAl), sadece bu ornegin
// bellegini korumak yeterli DEGIL — kurulu PWA + tarayici sekmesi ayni anda
// acikken, BASKA bir ornek zombi yazmadan habersiz kendi turunu baslatip
// ayni deltayi tekrar uygulayabilirdi. Sona erme zamani (bitis DAMGASI,
// bayrak DEGIL) localStorage'a yazilir — kiralamadaki {sahip, bitis}
// deseniyle ayni: temizleme zamanlayicisi hic calismasa bile (sekme
// kapansa, arka planda kisilsa) pencere kendiliginden gecerliligini
// yitirir, kalici olarak takili kalmaz.
let zamanAsimliTurBekliyor = false;
const ZAMAN_ASIMI_SONRASI_GUVENLI_BEKLEME = 15000;
const ZAMAN_ASIMI_ANAHTARI = 'zombi_yazma_penceresi';   // ornekler arasi paylasilan bitis damgasi

function zombiYazmaPenceresindeMi() {
  if (zamanAsimliTurBekliyor) return true;
  try {
    const bitis = Number(localStorage.getItem(ZAMAN_ASIMI_ANAHTARI) || 0);
    return bitis > Date.now();
  } catch (e) {
    return false;   // localStorage okunamiyorsa yalnizca bu ornegin bayragina guvenilir
  }
}

function baglantiDurumunuAyarla(bagli) {
  const oncedenKopuktu = firebaseBagli === false;
  firebaseBagli = bagli === true;
  if (!firebaseBagli || !oncedenKopuktu) return;
  // zombiYazmaPenceresindeMi() burada da sinanir (trySyncQueue zaten kendi
  // basina yeterli olsa da): boylece bu pencerede sonrakiDenemeZamani
  // gereksiz yere sifirlanmaz, hataOldu'nun kurdugu geri cekilme bozulmaz.
  if (zombiYazmaPenceresindeMi()) return;
  // Baglanti gercekten geri geldi: geri cekilme kapisini ac ve hemen dene.
  sonrakiDenemeZamani = 0;
  trySyncQueue();
}

// Kullaniciya "hangi islem takildi" diyebilmek icin okunabilir ozet.
function kuyrukOgesiOzeti(oge) {
  if (!oge) return '';
  const yer = oge.type === 'transfer'
    ? `${(depots && depots[oge.fromDepot]) || oge.fromDepot} → ${(depots && depots[oge.toDepot]) || oge.toDepot}`
    : ((depots && depots[oge.depotId]) || oge.depotId);
  const tur = oge.type === 'transfer' ? 'Transfer' : (oge.type === 'giris' ? 'Giriş' : 'Çıkış');
  return `${tur} · ${oge.ad || oge.kod} · ${fmtNum(oge.miktar)} ${oge.birim || ''} · ${yer}`;
}

// ===== Ornekler arasi kuyruk kilidi (I3) =====
// kuyrukIsleniyor yalnizca BU JS baglaminda gecerli; kuyruk ise ayni kokendeki
// tum ornekler tarafindan paylasilan localStorage'da duruyor. Kurulu PWA ile
// tarayici sekmesi ayni anda acikken 15 sn'lik zamanlayicilar yakin anda
// tetiklenirse ikisi de kilidi bos gorur, ikisi de ayni ogeyi uygular ve delta
// sunucuya IKI KEZ yazilir (Ana=100, CIKIS 5 -> 90; dogrusu 95).
//
// Once Web Locks denenir (Chrome/Safari destekliyor, sekme cokerse kilit
// kendiliginden birakilir). Yoksa localStorage uzerinde SURELI kiralama:
// sahiplik damgasi + bitis zamani, boylece kilidi tutan ornek coker de
// birakamazsa kilit sonsuza kadar kalmaz.
const KILIT_ADI = 'alkol_kuyruk_kilidi';
const KILIT_ANAHTARI = 'pending_queue_kilit';
const KILIT_OMRU = 30000;       // kiralama suresi
const KILIT_TAZELEME = 10000;   // uzun suren gonderimde kiralama tazelenir
const ORNEK_KIMLIGI = 'ornek_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);

function kiralamaOku() {
  try { return JSON.parse(localStorage.getItem(KILIT_ANAHTARI) || 'null'); } catch (e) { return null; }
}

// Basarili olursa { birak, bizdeMi } doner, olmazsa null. null bir HATA DEGIL:
// "baska bir ornek zaten isliyor" demektir, cagiran sessizce doner.
// bizdeMi(): kiralama SU AN hala bizde mi? Arka planda kisilan/dondurulan
// sekmede tazeleyici durur, 30 sn sonra kiralama duser ve baska ornek devralir;
// bu sekme sonradan uyanip yazarsa ayni delta iki kez uygulanir. Bu yuzden
// Firebase'e yazmadan hemen once sahiplik yeniden sinanir.
function kiralamaAl() {
  const simdi = Date.now();
  const mevcut = kiralamaOku();
  if (mevcut && mevcut.sahip !== ORNEK_KIMLIGI && Number(mevcut.bitis) > simdi) return null;
  try {
    localStorage.setItem(KILIT_ANAHTARI, JSON.stringify({ sahip: ORNEK_KIMLIGI, bitis: simdi + KILIT_OMRU }));
  } catch (e) {
    return null;   // kiralamayi yazamiyorsak kilit iddia edilemez
  }
  // yazma ile okuma arasinda baska bir ornek uzerine yazmis olabilir
  const dogrula = kiralamaOku();
  if (!dogrula || dogrula.sahip !== ORNEK_KIMLIGI) return null;
  const tazeleyici = setInterval(() => {
    const o = kiralamaOku();
    if (!o || o.sahip !== ORNEK_KIMLIGI) return;   // kiralama elimizden alinmis, tazeleme
    try { localStorage.setItem(KILIT_ANAHTARI, JSON.stringify({ sahip: ORNEK_KIMLIGI, bitis: Date.now() + KILIT_OMRU })); } catch (e) {}
  }, KILIT_TAZELEME);
  return {
    birak: () => {
      clearInterval(tazeleyici);
      const o = kiralamaOku();
      if (o && o.sahip === ORNEK_KIMLIGI) { try { localStorage.removeItem(KILIT_ANAHTARI); } catch (e) {} }
    },
    bizdeMi: () => {
      const o = kiralamaOku();
      return !!o && o.sahip === ORNEK_KIMLIGI && Number(o.bitis) > Date.now();
    },
  };
}

// Promise<{birak, bizdeMi}|null> doner.
function kuyrukKilidiniAl() {
  if (typeof navigator !== 'undefined' && navigator.locks && navigator.locks.request) {
    return new Promise(cozumle => {
      let birak;
      const tutulan = new Promise(r => { birak = r; });
      navigator.locks.request(KILIT_ADI, { ifAvailable: true, mode: 'exclusive' }, kilit => {
        if (!kilit) { cozumle(null); return; }   // baska ornek tutuyor
        // Web Locks'ta kilit birakilana kadar tarayici garantisiyle bizdedir;
        // kiralamadaki gibi elimizden alinamaz, bu yuzden bizdeMi hep true.
        cozumle({ birak: () => birak(), bizdeMi: () => true });
        return tutulan;                          // birak() cagrilana kadar kilit bizde
      }).catch(() => cozumle(null));
    });
  }
  return Promise.resolve(kiralamaAl());
}

function updateOfflineBar() {
  const bar = document.getElementById('offlineBar');
  const q = getQueue();
  const isOnline = navigator.onLine;
  if (depolamaDoldu) {
    bar.style.display = 'block';
    bar.style.background = '#c62828';
    bar.textContent = q.length > 0
      ? `Cihaz depolaması dolu — ${q.length} işlem gönderilemedi, sunucuya hiçbir şey yazılmadı. Kayıtlar cihazda duruyor; telefonda yer açıp uygulamayı yeniden başlatın, gönderim kaldığı yerden sürer.`
      : 'Cihaz depolaması dolu — senkronizasyon durduruldu, sunucuya hiçbir şey yazılmadı. Telefonda yer açıp uygulamayı yeniden başlatın.';
    return;
  }
  if (!isOnline) {
    bar.style.display = 'block';
    bar.textContent = q.length > 0
      ? `İnternet yok — ${q.length} işlem bekliyor, bağlantı gelince otomatik gönderilecek`
      : 'İnternet yok — işlemler cihazda kaydediliyor';
  } else if (q.length > 0) {
    bar.style.display = 'block';
    const hataSayisi = (q[0] && q[0]._hataSayisi) || 0;
    if (hataSayisi >= HATA_ESIGI) {
      // Gecici senkronizasyondan AYIRT EDILEBILIR olmali: mavi serit "birazdan
      // gecer" demek, bu ise "gecmiyor, mudahale gerek" demek.
      bar.style.background = '#C00000';
      bar.textContent = `Bir işlem gönderilemiyor (${hataSayisi} deneme): ${kuyrukOgesiOzeti(q[0])}. `
        + `Bekleyen ${q.length} işlem cihazda duruyor, hiçbiri silinmedi — sunucudaki stok bu işlemler kadar eski. `
        + `İnterneti kontrol edip uygulamayı yeniden başlatın; sürerse bu işlemi yöneticiye bildirin.`;
    } else {
      bar.style.background = '#1565c0';
      bar.textContent = `${q.length} işlem senkronize ediliyor...`;
    }
  } else {
    bar.style.display = 'none';
    bar.style.background = '#c62828';
  }
}

function applyDeltaLocal(depotId, kod, delta) {
  if (!stock[depotId]) stock[depotId] = {};
  stock[depotId][kod] = round2((stock[depotId][kod] || 0) + delta);
}

let kuyrukIsleniyor = false; // ayni kuyruk ogesinin ust uste calisan trySyncQueue cagrilarinda iki kez uygulanmasini engeller

// Ilerleme isareti kalicilastirilamadiginda firlatilir; korukorune yeniden denemek
// yerine senkronizasyonu durdurmak icin normal ag hatasindan ayirt edilir.
function DepolamaHatasi() { this.name = 'DepolamaHatasi'; }

function trySyncQueue() {
  if (depolamaDoldu) { updateOfflineBar(); return; } // yeniden deneme zamanlayicisi kurulmaz
  if (!navigator.onLine) { updateOfflineBar(); return; }
  // Baglanti olu iken tur baslatma: asili kalacak bir yazma kuyruklamak, tur
  // zaman asimi ile birlikte ayni deltanin iki kez uygulanmasina yol acardi.
  if (!firebaseBagli) { updateOfflineBar(); return; }
  // Tek giris noktasi: bunu SADECE reconnect kisayolunda ya da yalnizca bu
  // ornegin bellegindeki bir bayrakla sinamak yetmezdi — hataOldu'nun kendi
  // 5 sn'lik yeniden deneme zamanlayicisi, setInterval(trySyncQueue, 15000),
  // 'online' dinleyicisi VE ayni kuyrugu paylasan BASKA BIR ORNEK, hepsi bu
  // fonksiyona farkli yollardan giriyor. zombiYazmaPenceresindeMi()
  // localStorage'daki paylasilan bitis damgasini da sinar (bkz. tanimindaki
  // yorum) — kapi burada, TEK yerde, her giris yolunu ve her ornegi kapsar.
  if (zombiYazmaPenceresindeMi()) { updateOfflineBar(); return; }
  // Geri cekilme kapisi: setInterval de, dogrudan cagrilar da bu zamani gozetmeli,
  // yoksa 15 sn'lik zamanlayici artan araligi bosa cikarir.
  if (Date.now() < sonrakiDenemeZamani) { updateOfflineBar(); return; }
  if (kuyrukIsleniyor) return; // setInterval, 'online' olayi ve dogrudan cagri ust uste binebilir
  if (getQueue().length === 0) { updateOfflineBar(); return; }
  // Sonda kapisi kilitten ONCE de calisir: kiralama kilidi de localStorage'a
  // yaziyor, kota doluyken kilit hic alinamaz ve kapiya varilamazdi — kullanici
  // "cihaz depolamasi dolu" uyarisini hic gormezdi. (Kilidin ardinda BIR KEZ DAHA
  // sinanir; asil garanti orada, Firebase'e dokunmadan hemen once.)
  if (!kuyrukYazilabilirMi()) { senkronizasyonuDurdur(); return; }
  // Kilit beklenirken bu baglamda yeniden girilmesin diye bayrak simdi kurulur.
  kuyrukIsleniyor = true;
  try {
    kuyrukKilidiniAl().then(kilit => {
      // Kilit alinamadi = baska bir ornek zaten isliyor. Hata degil, sessizce don.
      if (!kilit) { kuyrukIsleniyor = false; return; }
      try {
        kuyruguIsle(kilit);
      } catch (e) {
        // N3: kuyruguIsle'nin ic try/catch'inin DISINDA kalan senkron istisna.
        // Buradan kacan istisna kilidi kalici tutardi — .catch() yalnizca JS
        // bayragini kurtarir, ornekler arasi kilidi degil: cihazdaki tum
        // ornekler susardi. Kilit her kosulda birakilir.
        try { kilit.birak(); } catch (e2) {}
        kuyrukIsleniyor = false;
        try { updateOfflineBar(); } catch (e3) {}
      }
    }).catch(() => { kuyrukIsleniyor = false; });
  } catch (e) {
    // Kilit katmanindan senkron istisna: bayrak kalici true kalmasin.
    // 15 sn'lik zamanlayici bir sonraki turda yeniden dener.
    kuyrukIsleniyor = false;
  }
}

function kuyruguIsle(kilit) {
  // Kilit bir turda yalnizca bir kez birakilir; bitir/hataOldu de bir kez calisir.
  let bitti = false;
  let turSayaci = null;   // asagida kurulur; bitir/hataOldu calisinca iptal edilir
  const kilidiCoz = () => { const k = kilit; kilit = null; if (k) k.birak(); };

  // Kilidi beklerken durum degismis olabilir: baska ornek kuyrugu bosaltmis,
  // bu ornekte senkronizasyon durdurulmus, ya da (kilit talebi cikarken
  // senkrondu ama yine de) tam bu sirada baska bir ornek zaman asimina
  // ugramis olabilir. Kilidin ARDINDAN yeniden oku — savunma katmani,
  // trySyncQueue'daki kapiyla ayni kontrol.
  if (zombiYazmaPenceresindeMi()) { kilidiCoz(); kuyrukIsleniyor = false; updateOfflineBar(); return; }
  if (depolamaDoldu) { kilidiCoz(); kuyrukIsleniyor = false; updateOfflineBar(); return; }
  const q = getQueue();
  if (q.length === 0) { kilidiCoz(); kuyrukIsleniyor = false; updateOfflineBar(); return; }
  // Firebase'e TEK BIR delta uygulamadan once ilerleme isaretini yazabilecek
  // miyiz? Yazamiyorsak hicbir seye dokunmadan dur: uygulanmis ama isaretlenmemis
  // delta, yeniden baslatmada ikinci kez uygulanirdi.
  if (!kuyrukYazilabilirMi()) { kilidiCoz(); kuyrukIsleniyor = false; senkronizasyonuDurdur(); return; }
  // Kiralama SU AN hala bizde mi? Arka planda kisilan sekmede tazeleyici
  // durabilir, kiralama duser, baska ornek devralir. Firebase'e dokunmadan
  // hemen once sahiplik yeniden sinanir — degilse hicbir delta uygulanmaz,
  // oge kuyrukta kalir, devralan ornek (ya da bir sonraki tur) isler.
  if (!kilit.bizdeMi()) { kilidiCoz(); kuyrukIsleniyor = false; updateOfflineBar(); return; }
  updateOfflineBar();

  const next = q[0];
  const applyOne = (depotId, kod, delta) =>
    db.ref(`stock/${depotId}/${kod}`).transaction(cur => round2((cur || 0) + delta));

  // Baslangicta hangi adimlarin daha once (ag kopmasi oncesi bir denemede) tamamlandigini
  // kuyruktaki ogeden okur; sadece kalan adimlar tekrar denenir, tamamlanmis adimlar
  // ikinci kez uygulanmaz.
  // Isareti cihaza yazamazsa DepolamaHatasi firlatir: isaret kalicilasmadan
  // yeniden denemek ayni deltayi ikinci kez uygulamak demektir.
  const guncelleKuyrukOgesi = (yamalar) => {
    Object.assign(next, yamalar);
    const guncel = getQueue();
    if (guncel.length && guncel[0].localId === next.localId) {
      Object.assign(guncel[0], yamalar);
      if (!setQueue(guncel)) throw new DepolamaHatasi();
    }
  };

  // Ardisik hata sayaci ogenin KENDI alaninda tutulur ve mevcut isaret desenindeki
  // gibi kalicilastirilir: uygulama yeniden baslasa da takilan oge takili bilinir.
  // Yazma basarisiz olursa sayac bellekte kalir — hicbir Firebase deltasi bu
  // yazmaya bagli olmadigi icin bu guvenlidir.
  const hataSayisiniArtir = () => {
    const guncel = getQueue();
    if (!guncel.length || guncel[0].localId !== next.localId) return 1;  // kuyrugun basi degismis, bu deneme bayat
    const sayi = (guncel[0]._hataSayisi || 0) + 1;
    guncel[0]._hataSayisi = sayi;
    next._hataSayisi = sayi;
    setQueue(guncel);
    return sayi;
  };

  const bitir = () => {
    if (bitti) return;
    bitti = true;
    clearTimeout(turSayaci);
    try {
      sonrakiDenemeZamani = 0;   // basarili gonderim: geri cekilme sifirlanir
      const remaining = getQueue().slice(1);
      if (!setQueue(remaining)) { senkronizasyonuDurdur(); return; }
      if (remaining.length > 0) setTimeout(trySyncQueue, 200);
    } finally {
      kilidiCoz();               // kuyruk yazildiktan SONRA birakilir
      kuyrukIsleniyor = false;   // setQueue patlasa bile kilit kalici olmaz
      updateOfflineBar();
    }
  };

  const hataOldu = (e) => {
    if (bitti) return;
    bitti = true;
    clearTimeout(turSayaci);
    if (e instanceof DepolamaHatasi) { kilidiCoz(); kuyrukIsleniyor = false; senkronizasyonuDurdur(); return; }
    // Oge ATILMAZ; yalnizca yeniden deneme araligi acilir ve esik asilinca
    // kullanici durum cubugunda kalici uyari gorur.
    const bekleme = geriCekilmeSuresi(hataSayisiniArtir());
    sonrakiDenemeZamani = Date.now() + bekleme;
    kilidiCoz();
    kuyrukIsleniyor = false;
    updateOfflineBar();
    setTimeout(trySyncQueue, bekleme);
  };

  const kaydiGonder = () => {
    if (next._kaydedildi) { bitir(); return; }
    const rec = {...next};
    // localId bilerek KALIYOR: push() sonrasi baglanti koparsa ve tekrar
    // denemede ayni kayit ikinci kez push edilirse, bu alan sayesinde
    // kopya tespit edilebilir kalir (aksi halde iz sürülemez, bkz. inceleme).
    delete rec._stokUygulandi;
    delete rec._fromUygulandi;
    delete rec._toUygulandi;
    delete rec._kaydedildi;
    delete rec._hataSayisi;   // yerel yeniden deneme sayaci Firebase semasina sizmasin

    const yeniKayitGonder = () =>
      db.ref('transactions').push(rec).then(() => { guncelleKuyrukOgesi({ _kaydedildi: true }); bitir(); }).catch(hataOldu);

    // Ilk denemede dogrudan gonder — ekstra sorgu maliyeti yok. En az bir
    // basarisiz deneme (_hataSayisi > 0) sonrasindaysa, push sunucuya ulasip
    // yanit kaybolmus olabilir: tekrar push etmeden once ayni localId'yle bir
    // kayit zaten var mi diye sorulur. Varsa kopya olusturulmaz, dogrudan
    // tamamlanmis sayilir.
    if (!next._hataSayisi) { yeniKayitGonder(); return; }
    db.ref('transactions').orderByChild('localId').equalTo(next.localId).limitToFirst(1).once('value')
      .then(snap => {
        if (snap.exists()) { guncelleKuyrukOgesi({ _kaydedildi: true }); bitir(); }
        else { yeniKayitGonder(); }
      })
      .catch(hataOldu);
  };

  const sevkEt = () => {
    if (next.type === 'transfer') {
      const cikisSozu = next._fromUygulandi ? Promise.resolve()
        : applyOne(next.fromDepot, next.kod, -next.miktar).then(() => guncelleKuyrukOgesi({ _fromUygulandi: true }));
      const girisSozu = next._toUygulandi ? Promise.resolve()
        : applyOne(next.toDepot, next.kod, next.miktar).then(() => guncelleKuyrukOgesi({ _toUygulandi: true }));
      Promise.all([cikisSozu, girisSozu]).then(kaydiGonder).catch(hataOldu);
    } else if (next._stokUygulandi) {
      kaydiGonder();
    } else {
      const delta = next.type === 'giris' ? next.miktar : -next.miktar;
      applyOne(next.depotId, next.kod, delta).then(() => { guncelleKuyrukOgesi({ _stokUygulandi: true }); kaydiGonder(); }).catch(hataOldu);
    }
  };

  // ===== Cihazlar arasi CIFT GERI ALMA korumasi =====
  // geriAl'in sunucu denetimi cevrimdisiyken zaman asimina ugrayip yerel
  // karara guveniyor (offline-first). Baska bir cihaz ayni islemi coktan
  // geri almissa bu ikinci ters kayit stogu IKINCI KEZ bozar: 5 adet iki kez
  // geri alinir. localId denetimi burada ise yaramaz — iki cihazin localId'si
  // farklidir; ayirt edici alan revertOf'tur.
  //
  // Denetim, HICBIR BACAK UYGULANMADAN once yapilir. kaydiGonder icinde
  // yapmak gec kalirdi: oraya varildiginda applyOne stogu coktan degistirmis
  // olur ve kaydi dusurmek stok hatasini geri almaz.
  //
  // Bir bacak zaten uygulanmissa denetim ATLANIR: o delta sunucuda duruyor,
  // ogeyi dusurmek kayitsiz bir stok degisikligi birakirdi. O halde sorgu
  // zaten kendi kaydimizi bulurdu (bkz. kaydiGonder'deki localId denetimi).
  const kopyaDenetimiGerekli = !!next.revertOf
    && !next._stokUygulandi && !next._fromUygulandi && !next._toUygulandi && !next._kaydedildi;

  // Tur zaman asimi: applyOne()/push() sozu, navigator.onLine=true olsa bile
  // baglanti gercekten oluyken HIC cozulmeyebilir (RTDB'nin standart cevrimdisi
  // davranisi). Cozulmezse ne bitir() ne hataOldu() calisir; kilit (JS bayragi +
  // ornekler arasi kilit) kalici tutulur ve cihazdaki TUM ornekler susar. Bu
  // sayac tur GERCEKTEN Firebase'e dokunmaya baslarken kurulur; bitir/hataOldu
  // normal calisirsa iptal edilir, calismazsa kendisi hataOldu'yu tetikler.
  turSayaci = setTimeout(() => {
    // Vazgecilen turun sozu SDK'nin ic kuyruguna dusmus olabilir — bkz.
    // zamanAsimliTurBekliyor tanimindaki yorum. trySyncQueue()'nun kendi
    // giris kapisini bir sure kapali tutar: reconnect, hataOldu'nun geri
    // cekilme zamanlayicisi, setInterval, dogrudan cagrilar VE ayni kuyrugu
    // paylasan baska bir ornek dahil HEPSI — bu yuzden pencere hem bu
    // ornegin bellegine (zamanAsimliTurBekliyor) hem localStorage'a
    // (ZAMAN_ASIMI_ANAHTARI) yazilir. Bayrak/anahtar YALNIZCA kendi
    // zamanlayicilariyla geri duser — bitir() onlara dokunmaz, "bir sonraki
    // basarili tur" erken temizlemez.
    zamanAsimliTurBekliyor = true;
    try { localStorage.setItem(ZAMAN_ASIMI_ANAHTARI, String(Date.now() + ZAMAN_ASIMI_SONRASI_GUVENLI_BEKLEME)); } catch (e) {}
    setTimeout(() => {
      zamanAsimliTurBekliyor = false;
      // removeItem SART DEGIL (anahtar zaten bir BITIS DAMGASI, boole degil —
      // zombiYazmaPenceresindeMi() suresi gecince kendiliginden gecersiz sayar,
      // kiralamadaki {sahip, bitis} deseniyle ayni), ama temiz tutmak icin silinir.
      try { localStorage.removeItem(ZAMAN_ASIMI_ANAHTARI); } catch (e) {}
    }, ZAMAN_ASIMI_SONRASI_GUVENLI_BEKLEME);
    hataOldu(new Error('tur zaman asimi — baglanti oluyken bir yazma cozulmedi'));
  }, TUR_ZAMAN_ASIMI);

  // M1: sevk blogundan kacan SENKRON bir istisna, kilidi kalici true birakip
  // oturum boyunca senkronizasyonu oldururdu. Bugun ulasilabilir bir tetikleyici
  // bilinmiyor; koruma katmani yine de olmali — istisna hataOldu yoluna dusurulur,
  // kilit (hem JS bayragi hem ornekler arasi kilit) serbest kalir.
  try {
    if (!kopyaDenetimiGerekli) { sevkEt(); return; }
    // tersKayitSunucuKontrolu SURELIDIR: cevrimdisiyken sorgu hic cozulmez,
    // sarmalayici 'bilinmiyor' ile serbest birakir — tur asili kalmaz.
    // KUYRUK_KOPYA_KONTROL_SURESI kullanilir (geriAl'in 4 sn'lik insan-bekliyor
    // tavani degil) — bu bir arka plan turu, zaman asimi ARDINDAKI tum
    // kuyrugu da bloke eder.
    tersKayitSunucuKontrolu(next.revertOf, KUYRUK_KOPYA_KONTROL_SURESI).then(durum => {
      try {
        if (durum === 'var') {
          // Baska cihaz coktan geri almis: oge KOPYA. Hicbir delta
          // uygulanmadi, kayit push edilmedi; oge kuyruktan dusurulur.
          // Yerel stok da dogruya yakinsar: sunucudaki tek geri alma
          // 'stock' dinleyicisiyle bu cihaza da iniyor.
          // geriAlDevam() bu ogeyi kuyruga girmeden once transactions'a
          // (unshift) ve cache_tx'e coktan yazmisti (iyimser gosterim).
          // Push hic yapilmadigi icin transactions dinleyicisi onu asla
          // silmeyecek — hayalet bir "ikinci geri alma" satiri gecmiste
          // kalici kalirdi. Burada elle cikarilir.
          transactions = transactions.filter(t => t.localId !== next.localId);
          saveCache();
          // scheduleRender() (render() degil): bu arka plan senkron turu,
          // diger Firebase dinleyicileriyle ayni desen — kullanici bir yere
          // yaziyorsa render araya girmez, focusout'ta kendiliginden akar.
          scheduleRender();
          // Once bitir(): kuyruk yazilip kilit BIRAKILSIN, sonra kullaniciyi
          // bilgilendir. Ters sirada alert kilidi acik tutardi.
          bitir();
          alert('Bir geri alma uygulanmadı: bu işlem başka bir cihazda zaten geri alınmıştı.\n\nStok tek geri alma kadar değişti, ikinci kez uygulanmadı.');
          return;
        }
        if (durum === 'bilinmiyor') {
          // Sunucuya sorulamadi. BURADA yerel karara guvenmek, tam da
          // kapatilmak istenen cift uygulama deliğidir: oge kuyrukta
          // KALIR ve geri cekilmeyle yeniden denenir. Hicbir sey kaybolmaz.
          hataOldu(new Error('kopya denetimi yapilamadi'));
          return;
        }
        sevkEt();   // 'yok' — sunucuda ters kayit yok, normal yol
      } catch (e) {
        hataOldu(e);
      }
    }).catch(hataOldu);   // hataOldu bitti bayragiyla korumali: iki kez calismaz
  } catch (e) {
    hataOldu(e);
  }
}

// Baglanti geri geldi: gercek bir sinyal oldugu icin geri cekilme kapisi acilir,
// takilmis kuyruk 5 dk beklemeden hemen denenir.
window.addEventListener('online', () => {
  // baglantiDurumunuAyarla'daki ayni gerekce: zombi-yazma penceresindeyken
  // sonrakiDenemeZamani'yi sifirlamak hataOldu'nun kurdugu geri cekilmeyi
  // bosa cikarirdi — trySyncQueue zaten girisi reddedecek olsa da.
  if (zombiYazmaPenceresindeMi()) return;
  sonrakiDenemeZamani = 0;
  trySyncQueue();
});
window.addEventListener('offline', updateOfflineBar);
setInterval(trySyncQueue, 15000);
updateOfflineBar();

// firebaseBagli'yi gercek bir sinyalle besler — bu dinleyici olmadan degisken
// kalici olarak true kalir ve "baglanti oluyken tur baslatma" hizli yollari
// (trySyncQueue, urunSunucuKontrolu, tersKayitSunucuKontrolu,
// kullaniciSunucuKontrolu haric — o kapi degisken tanimlanmadan calisir)
// hicbir zaman devreye girmez; zaman asimina dusmeye devam ederler ama
// gereksiz yere.
db.ref('.info/connected').on('value', snap => baglantiDurumunuAyarla(snap.val() === true));

// Firebase listeners (bağlantı varsa canlı veriyle günceller)
db.ref('depots').on('value', snap => {
  const val = snap.val();
  if (val) depots = {...DEFAULT_DEPOTS, ...val};
  saveCache();
  scheduleRender();
});

db.ref('stock').on('value', snap => {
  const val = snap.val() || {};
  const yeni = {};
  Object.keys(depots).forEach(id => { yeni[id] = val[id] || {}; });
  Object.keys(val).forEach(id => { if (!yeni[id]) yeni[id] = val[id] || {}; });
  stock = yeni;
  saveCache();
  scheduleRender();
});

db.ref('transactions').limitToLast(300).on('value', snap => {
  const val = snap.val() || {};
  transactions = Object.keys(val).map(k => ({ id: k, ...val[k] }));
  saveCache();
  scheduleRender();
});

db.ref('customProducts').on('value', snap => {
  customProducts = snap.val() || {};
  saveCache();
  scheduleRender();
});

db.ref('users').on('value', snap => {
  users = snap.val() || {};
  usersSunucudanGeldi = true;
  // mevcutKullanici GIRIS ANINDA alinmis bir KOPYA. Bu dinleyici users'i
  // tazeliyordu ama kopyayi tazelemiyordu: yoneticiligi alinan ya da hesabi
  // silinen bir kullanici, o cihaz yeniden YUKLENENE KADAR tam yonetici
  // arayuzunu ve fonksiyonlarini koruyordu. Yetkinin geri alinabilmesi icin
  // kopya her users guncellemesinde sunucudaki kayitla eslenir.
  if (mevcutKullanici) {
    const taze = users[mevcutKullanici.id];
    if (taze) {
      mevcutKullanici = { id: mevcutKullanici.id, ...taze };
      navYetkisiniUygula();
    } else if (Object.keys(users).length > 0) {
      // Kayit silinmis: oturum dusurulur, cihaz kimligi gecersiz sayilir ve
      // PIN yeniden sorulur. users dolu oldugu icin eslesecek bir PIN VAR.
      mevcutKullanici = null;
      localStorage.removeItem('pin_dogrulandi');
      localStorage.removeItem('cache_kullanici_id');
      // Acik islem modali KAPATILIR. Kapatilmazsa modal PIN ekraninin altinda
      // girilmis degerleriyle duruyordu; baska biri giris yapip o modali
      // kaydettiginde kayit YANLIS kisinin adina yazilirdi — Gorev 5'in iz
      // kaydinin tam da onlemek icin var oldugu sey.
      // closeModal() degil overlayKaldir(): closeModal history.back() ile
      // overlayAc'in pushState'ini geri sariyor; buraya kullanici gezinmesi
      // olmadan gelindigi icin dogrudan kaldirma dogru olan.
      overlayKaldir();
      navYetkisiniUygula();
      pinEkraniniGoster();
    }
    // users TAMAMEN bos geldiyse oturum DUSURULMEZ. Uygulama uzerinden users'in
    // bosalmasi mumkun degil (son yonetici ne silinebilir ne dusurulebilir, kimse
    // kendi hesabini silemez); bos gelmesi ancak disaridan silme ya da okuma
    // izninin kaybi demektir. O durumda tum cihazlarin oturumunu dusurmek,
    // eslesecek hicbir PIN kalmadigi icin filoyu topluca kilitlerdi — kodun
    // her yerindeki "serbest birakma yonunde basarisiz ol" kurali geregi
    // mevcut oturum oldugu gibi birakilir.
  }
  // Acik bir PIN ekrani varsa veri artik geldi: dugme beklemeden cikar.
  pinEkraniVeriDurumunuTazele();
  saveCache();
  scheduleRender();
});

// ===== Modal: yeni işlem =====
let txType = 'giris';
let selectedProduct = null;
let quickDepotContext = null; // ürün satırından tıklanınca hangi depo bağlamında açıldığı
let islemKaydediliyor = false; // cift-tiklama/cift-dokunma korumasi (saveTransaction)

document.getElementById('fabBtn').addEventListener('click', () => {
  quickDepotContext = openDepotDetail || null;
  openModal();
});

function overlayAc(icHtml) {
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'modalOverlay';
  overlay.innerHTML = icHtml;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  history.pushState({ modalAcik: true }, '');
  return overlay;
}

function overlayKaldir() {
  const o = document.getElementById('modalOverlay');
  if (o) o.remove();
  quickDepotContext = null;
  bekleyenRenderiBosalt();
}

window.addEventListener('popstate', () => {
  if (document.getElementById('modalOverlay')) { overlayKaldir(); return; }
  if (openDepotDetail) { depotListesineDon(); }
});

function openModal() {
  txType = 'giris';
  selectedProduct = null;
  overlayAc(`
    <div class="modal">
      <h2>Yeni İşlem</h2>
      <div class="type-tabs">
        <button id="typeGiris" class="sel-giris" onclick="setType('giris')">Giriş</button>
        <button id="typeCikis" onclick="setType('cikis')">Çıkış</button>
        <button id="typeTransfer" onclick="setType('transfer')">Transfer</button>
      </div>

      <div id="depotFields"></div>

      <label>Ürün</label>
      <input type="text" id="prodSearch" placeholder="Ürün adı veya kod ara..." autocomplete="off" oninput="searchProduct(this.value)">
      <div class="autocomplete-list" id="acList"></div>
      <div id="selectedProdBox"></div>

      <label>Miktar</label>
      <input type="number" id="miktarInput" placeholder="Örn: 12" min="0" step="0.01"
             inputmode="decimal" enterkeyhint="done">

      <label>Not (opsiyonel)</label>
      <input type="text" id="noteInput" placeholder="Örn: tedarikçi adı, sebep...">

      <div class="err" id="modalErr"></div>

      <button class="save-btn" onclick="saveTransaction()">Kaydet</button>
      <button class="cancel-btn" onclick="closeModal()">Vazgeç</button>
    </div>
  `);
  renderDepotFields();
  if (quickDepotContext) applyQuickDepotPreset(quickDepotContext);
}

function quickTap(depotId, kod) {
  const p = prodMap()[kod];
  if (!p) return;
  txType = 'giris';
  selectedProduct = p;
  quickDepotContext = depotId;
  const currentQty = (stock[depotId] && stock[depotId][kod]) || 0;
  overlayAc(`
    <div class="modal">
      <h2>${escapeHtml(p[1])}</h2>
      <div style="font-size:12px;color:#999;margin:-8px 0 14px;">${escapeHtml(p[0])} &middot; ${escapeHtml(depots[depotId])} içinde şu an: <b>${fmtNum(currentQty)} ${escapeHtml(p[2])}</b></div>
      <div class="type-tabs">
        <button id="typeGiris" class="sel-giris" onclick="setType('giris')">Giriş</button>
        <button id="typeCikis" onclick="setType('cikis')">Çıkış</button>
        <button id="typeTransfer" onclick="setType('transfer')">Transfer</button>
      </div>

      <div id="depotFields"></div>

      <label>Miktar</label>
      <input type="number" id="miktarInput" placeholder="Örn: 12" min="0" step="0.01"
             inputmode="decimal" enterkeyhint="done">

      <label>Not (opsiyonel)</label>
      <input type="text" id="noteInput" placeholder="Örn: tedarikçi adı, sebep...">

      <div class="err" id="modalErr"></div>

      <button class="save-btn" onclick="saveTransaction()">Kaydet</button>
      <button class="cancel-btn" onclick="closeModal()">Vazgeç</button>
    </div>
  `);
  renderDepotFields();
  applyQuickDepotPreset(depotId);
  setTimeout(() => { const m = document.getElementById('miktarInput'); if (m) m.focus(); }, 60);
}

function applyQuickDepotPreset(depotId) {
  if (txType === 'transfer') {
    const from = document.getElementById('fromDepot');
    const to = document.getElementById('toDepot');
    if (from) from.value = depotId;
    if (to) {
      const other = Object.keys(depots).find(x => x !== depotId) || depotId;
      to.value = depotId === 'ana' ? other : 'ana';
    }
  } else {
    const single = document.getElementById('singleDepot');
    if (single) single.value = depotId;
  }
}

function closeModal() {
  if (history.state && history.state.modalAcik) {
    history.back();   // popstate tetiklenir, overlayKaldir cagirilir
  } else {
    overlayKaldir();
  }
}

function setType(t) {
  txType = t;
  ['typeGiris','typeCikis','typeTransfer'].forEach(id => document.getElementById(id).className = '');
  document.getElementById('typeGiris').className = t==='giris' ? 'sel-giris' : '';
  document.getElementById('typeCikis').className = t==='cikis' ? 'sel-cikis' : '';
  document.getElementById('typeTransfer').className = t==='transfer' ? 'sel-transfer' : '';
  renderDepotFields();
  if (quickDepotContext) applyQuickDepotPreset(quickDepotContext);
}

function renderDepotFields() {
  const box = document.getElementById('depotFields');
  const secenek = (id, secili) =>
    `<option value="${escapeHtml(id)}"${secili ? ' selected' : ''}>${escapeHtml(depots[id])}</option>`;
  const idler = Object.keys(depots);

  if (txType === 'transfer') {
    const varsayilanKaynak = idler.find(x => x !== 'ana') || idler[0];
    box.innerHTML = `
      <label>Nereden</label>
      <select id="fromDepot">${idler.map(id => secenek(id, id === varsayilanKaynak)).join('')}</select>
      <label>Nereye</label>
      <select id="toDepot">${idler.map(id => secenek(id, id === 'ana')).join('')}</select>
    `;
  } else {
    box.innerHTML = `
      <label>Depo</label>
      <select id="singleDepot">${idler.map(id => secenek(id, false)).join('')}</select>
    `;
  }
}

function searchProduct(q) {
  const acList = document.getElementById('acList');
  q = q.trim();
  if (q.length < 2) { acList.innerHTML = ''; return; }
  q = aramaNormali(q);
  const eslesenler = Object.values(prodMap())
    .filter(p => aramaNormali(p[1]).includes(q) || aramaNormali(p[0]).includes(q))
    .slice(0, 20);
  acList.innerHTML = eslesenler.map(p =>
    `<div data-eylem="urunSec" data-kod="${escapeHtml(p[0])}">${escapeHtml(p[1])}<div class="ac-code">${escapeHtml(p[0])} · ${escapeHtml(p[2])}</div></div>`
  ).join('');
}

function pickProduct(kod) {
  const p = prodMap()[kod];
  selectedProduct = p;
  document.getElementById('acList').innerHTML = '';
  document.getElementById('prodSearch').value = '';
  document.getElementById('selectedProdBox').innerHTML =
    `<div style="background:#eef2fb;border-radius:8px;padding:8px 10px;margin-top:6px;font-size:13px;">
      Seçilen: <b>${escapeHtml(p[1])}</b> (${escapeHtml(p[0])}, ${escapeHtml(p[2])})
      <span onclick="clearProduct()" style="float:right;color:#c62828;cursor:pointer;">&times;</span>
    </div>`;
}

function clearProduct() {
  selectedProduct = null;
  document.getElementById('selectedProdBox').innerHTML = '';
}

function stokYeterliMi(depoId, kod, miktar) {
  const mevcut = (stock[depoId] && stock[depoId][kod]) || 0;
  return { yeterli: miktar <= mevcut, mevcut };
}

function stokUyarisiGec(depoId, kod, miktar, birim) {
  const { yeterli, mevcut } = stokYeterliMi(depoId, kod, miktar);
  if (yeterli) return true;
  return confirm(
    `Stok yetersiz.\n\n${depots[depoId] || depoId} içinde şu an ${fmtNum(mevcut)} ${birim} var, ` +
    `${fmtNum(miktar)} ${birim} çıkışı yapılmak isteniyor.\n\nYine de kaydedilsin mi?`
  );
}

function saveTransaction() {
  if (islemKaydediliyor) return; // ayni islemin cift-tiklama/cift-dokunmayla iki kez kaydedilmesini engeller
  const errBox = document.getElementById('modalErr');
  errBox.style.display = 'none';

  if (!selectedProduct) {
    errBox.textContent = 'Lütfen bir ürün seç.';
    errBox.style.display = 'block';
    return;
  }
  // step="0.01" yalnizca arayuz ipucu — zorlanmiyor. Yuvarlanmamis giris
  // (0.015 gibi) kaydedilirse stok toplamalarindaki round2 ile giris degeri
  // arasinda fark olusur: giris + geri alma cifti baslangica DONMEZ.
  // Bu yuzden yuvarlama GIRIS NOKTASINDA yapilir.
  const hamMiktar = parseFloat(document.getElementById('miktarInput').value);
  if (!isFinite(hamMiktar) || hamMiktar <= 0) {
    errBox.textContent = 'Geçerli bir miktar gir.';
    errBox.style.display = 'block';
    return;
  }
  const miktar = round2(hamMiktar);
  // 0.004 gibi bir giris yuvarlaninca 0 olur ve reddedilmelidir (0.004 sise
  // anlamsiz), ama SESSIZCE degil: kullanici neden reddedildigini gormeli.
  if (miktar <= 0) {
    errBox.textContent = `Miktar en az 0,01 olmalı. Girilen ${hamMiktar} değeri 0,01'e yuvarlandığında 0 oluyor.`;
    errBox.style.display = 'block';
    return;
  }

  const note = document.getElementById('noteInput').value.trim();
  const [kod, ad, birim] = selectedProduct;
  const now = Date.now();
  const localId = 'local_' + now + '_' + Math.random().toString(36).slice(2,8);

  islemKaydediliyor = true;
  try {
    let txRecord;
    let deltalar;   // [[depoId, kod, delta], ...] — kuyruga yazilana kadar UYGULANMAZ
    if (txType === 'transfer') {
      const from = document.getElementById('fromDepot').value;
      const to = document.getElementById('toDepot').value;
      if (from === to) {
        errBox.textContent = 'Kaynak ve hedef depo aynı olamaz.';
        errBox.style.display = 'block';
        return;
      }
      if (!stokUyarisiGec(from, kod, miktar, birim)) return;
      txRecord = { type: 'transfer', fromDepot: from, toDepot: to, kod, ad, birim, miktar, note, ts: now, localId, kullaniciAdi: mevcutKullanici ? mevcutKullanici.ad : 'Bilinmeyen' };
      deltalar = [[from, kod, -miktar], [to, kod, miktar]];
    } else {
      const depotId = document.getElementById('singleDepot').value;
      if (txType === 'cikis' && !stokUyarisiGec(depotId, kod, miktar, birim)) return;
      txRecord = { type: txType, depotId, kod, ad, birim, miktar, note, ts: now, localId, kullaniciAdi: mevcutKullanici ? mevcutKullanici.ad : 'Bilinmeyen' };
      deltalar = [[depotId, kod, txType === 'giris' ? miktar : -miktar]];
    }

    // ONCE dayanikli kuyruga yaz, ANCAK basariliysa kalici etki dogur (geriAl ile ayni desen).
    // setQueue artik firlatmiyor, donus degeriyle bildiriyor — asagidaki catch'in
    // "cihaz depolamasi dolu" mesajini gostermesi icin hatayi burada uretiyoruz.
    const q = getQueue();
    q.push(txRecord);
    if (!setQueue(q)) throw new Error('Kuyruk cihaza yazilamadi');

    // Kuyruk yazmasi basarili — yerel etkiler simdi dogurulabilir
    deltalar.forEach(d => applyDeltaLocal(d[0], d[1], d[2]));
    // Anında ekranda göster (internet olmasa bile)
    transactions.unshift(txRecord);
    saveCache();

    updateOfflineBar();
    trySyncQueue();

    closeModal();
    render();
  } catch (e) {
    errBox.textContent = 'Kayıt yapılamadı — cihaz depolaması dolu ya da erişilemez olabilir. Hiçbir şey değişmedi; telefonda yer açıp tekrar deneyin.';
    errBox.style.display = 'block';
    throw e;
  } finally {
    // ayni islemi hemen tekrar kaydetmeyi engelleyen kisa sogutma; hata olsa bile kilit kalici olmaz
    setTimeout(() => { islemKaydediliyor = false; }, 500);
  }
}

function geriAl(id) {
  if (!mevcutKullanici || mevcutKullanici.rol !== 'yonetici') { alert('Bu işlem için yönetici yetkisi gerekir.'); return; }
  const tx = transactions.find(t => t.id === id);
  if (!tx) return;
  // Gecmis satirindaki dugme kosuluyla ayni gercek kullanilir
  if (geriAlinmisMi(tx)) { alert('Bu işlem zaten geri alınmış.'); return; }

  const ozet = tx.type === 'transfer'
    ? `${depots[tx.fromDepot] || tx.fromDepot} → ${depots[tx.toDepot] || tx.toDepot}`
    : (depots[tx.depotId] || tx.depotId);
  if (!confirm(`Geri alınacak:\n\n${tx.ad}\n${fmtNum(tx.miktar)} ${tx.birim || ''} · ${ozet}\n\nOnaylıyor musun?`)) return;

  // geriAlinmisMi() yalnizca son 300 kayidi ve BU cihazin kuyrugunu goruyor.
  // Ters kayit baska bir cihazdan geldiyse ya da bu islemin ustunden 300'den
  // fazla kayit gectiyse yerelde gorunmeyebilir (teorik, ama olasi). Kalici
  // etki dogurmadan hemen once, pencereden bagimsiz tanimlayici bir sorgu
  // atilir. Sorgu SURELIDIR: cevap gelmezse yerel karara guvenilip devam
  // edilir — offline-first tasarimla tutarli.
  tersKayitSunucuKontrolu(id).then(durum => {
    if (durum === 'var') {
      tx.reverted = true;
      saveCache();
      alert('Bu işlem zaten geri alınmış.');
      render();
      return;
    }
    geriAlDevam(tx, id, durum === 'bilinmiyor');
  }).catch(e => {
    // tersKayitSunucuKontrolu kendisi hicbir zaman reddetmez (her durumda
    // cozulur); bu yalnizca yukaridaki .then govdesinden (render() ya da
    // geriAlDevam) kacan beklenmedik bir senkron istisnayi yakalar —
    // urunEkle'deki ayni desen. Yakalanmazsa kullanici hicbir mesaj gormeden
    // kalirdi.
    console.warn('geri alma akisi hata verdi', e);
    alert('Geri alma tamamlanamadı — beklenmeyen bir hata oluştu.');
  });
}

// Her kosulda COZULUR: 'var' | 'yok' | 'bilinmiyor'. urunSunucuKontrolu ile
// ayni desen. KRITIK: RTDB'de once() sozu cevrimdisiyken HIC cozulmez — ne
// then ne catch calisir. Ciplak zincirde kullanici "Geri al"a basip
// onayliyor, sonra hicbir sey olmuyordu: stok degismiyor, kuyruga bir sey
// girmiyor, tek bir mesaj bile cikmiyordu. Depo alaninda geri alma en sik
// CEVRIMDISI yapilan islem oldugu icin bu, sessiz bir islev kaybiydi.
const GERI_AL_KONTROL_SURESI = 4000;    // geriAl: karsisinda bekleyen bir kullanici var, kisa tavan dogru
// kuyruguIsle: kimse beklemiyor, ARKA PLAN senkronu. Ayni 4 sn kullanilirsa
// zaman asimi kuyrugun basini "hataOldu" yoluna dusurur ve ARDINDAKI TUM
// ogeler de onunla birlikte durur (kuyruk yalnizca q[0]'i isler) — zayif
// bir baglantida sirf bu denetim yuzunden butun senkronizasyon kilitlenebilir.
// Bu yuzden kuyruk tarafinda cok daha genis bir tavan kullanilir.
const KUYRUK_KOPYA_KONTROL_SURESI = 20000;

function tersKayitSunucuKontrolu(id, sure) {
  return new Promise(cozumle => {
    let bitti = false;
    const bir = durum => { if (bitti) return; bitti = true; cozumle(durum); };
    // Baglanti olu iken sorgu hic cozulmez — beklemeye hic girme.
    if (!navigator.onLine || !firebaseBagli) { bir('bilinmiyor'); return; }
    const sayac = setTimeout(() => bir('bilinmiyor'), sure || GERI_AL_KONTROL_SURESI);
    try {
      db.ref('transactions').orderByChild('revertOf').equalTo(id).limitToFirst(1).once('value')
        .then(snap => { clearTimeout(sayac); bir(snap && snap.exists() ? 'var' : 'yok'); })
        .catch(() => { clearTimeout(sayac); bir('bilinmiyor'); });
    } catch (e) {
      clearTimeout(sayac);
      bir('bilinmiyor');
    }
  });
}

function geriAlDevam(tx, id, kontrolYapilamadi) {
  const simdi = Date.now();
  const localId = 'local_' + simdi + '_' + Math.random().toString(36).slice(2, 8);
  let ters;
  let deltalar;   // [[depoId, kod, delta], ...] — kuyruga yazilana kadar UYGULANMAZ

  if (tx.type === 'transfer') {
    ters = { type: 'transfer', fromDepot: tx.toDepot, toDepot: tx.fromDepot,
             kod: tx.kod, ad: tx.ad, birim: tx.birim, miktar: tx.miktar,
             note: 'Geri alma', ts: simdi, localId, revertOf: id,
             kullaniciAdi: mevcutKullanici ? mevcutKullanici.ad : 'Bilinmeyen' };
    deltalar = [[tx.toDepot, tx.kod, -tx.miktar], [tx.fromDepot, tx.kod, tx.miktar]];
  } else {
    const tersTur = tx.type === 'giris' ? 'cikis' : 'giris';
    ters = { type: tersTur, depotId: tx.depotId,
             kod: tx.kod, ad: tx.ad, birim: tx.birim, miktar: tx.miktar,
             note: 'Geri alma', ts: simdi, localId, revertOf: id,
             kullaniciAdi: mevcutKullanici ? mevcutKullanici.ad : 'Bilinmeyen' };
    deltalar = [[tx.depotId, tx.kod, tersTur === 'giris' ? tx.miktar : -tx.miktar]];
  }

  // ONCE dayanikli kuyruga yaz, ANCAK basariliysa kalici etki dogur.
  // Ters sirada (once uygula, sonra kuyruga yaz) kuyruk yazmasi basarisiz olursa
  // ters kayit hicbir yerde durmaz ama orijinal islem sunucuda kalici olarak
  // reverted:true isaretlenmis olur: sunucudaki stok hic duzelmez ve
  // geriAlinmisMi() bu bayragi gordugu icin "Geri al" dugmesi bir daha
  // gorunmez — kurtarma yolu kapanir.
  const q = getQueue();
  q.push(ters);
  if (!setQueue(q)) {
    // Hicbir sey degismedi: yerel stok, tx.reverted, sunucudaki bayrak ve
    // transactions dizisi oldugu gibi duruyor; kullanici sonra tekrar deneyebilir.
    senkronizasyonuDurdur();
    alert('Cihaz depolaması dolu — geri alma kaydedilemedi.\n\nHiçbir şey değişmedi: stok da işlem de olduğu gibi duruyor, işlem "geri alınmış" sayılmadı.\n\nTelefonda yer açıp uygulamayı yeniden başlatın; sonra bu işlemi tekrar geri alabilirsiniz.');
    return;
  }

  // Kuyruk yazmasi basarili — kalici etkiler simdi dogurulabilir
  deltalar.forEach(d => applyDeltaLocal(d[0], d[1], d[2]));
  tx.reverted = true;
  db.ref('transactions/' + id + '/reverted').set(true)
    .catch(e => console.warn('geri alma bayragi sunucuya yazilamadi', e));

  transactions.unshift(ters);
  saveCache();

  updateOfflineBar();
  trySyncQueue();
  render();

  // Kullanici sunucu dogrulamasinin YAPILAMADIGINI bilmeli: geri alma yerel
  // karara guvenilerek uygulandi. urunEkle'deki bildirimle ayni cizgide.
  if (kontrolYapilamadi) {
    alert('Geri alma kaydedildi.\n\nİnternet olmadığı için bu işlemin başka bir cihazda zaten geri alınıp alınmadığı sunucuda KONTROL EDİLEMEDİ. Kayıt cihazda duruyor, bağlantı gelince gönderilecek.');
  }
}

function round2(n) { return Math.round(n * 100) / 100; }

// ===== Service worker kaydi ve guncelleme akisi =====
let bekleyenSw = null;

function guncellemeyiUygula() {
  if (!bekleyenSw) { location.reload(); return; }
  bekleyenSw.postMessage('HEMEN_GEC');
}

async function guncellemeDenetle() {
  if (!('serviceWorker' in navigator)) { alert('Bu tarayıcı güncelleme denetimini desteklemiyor.'); return; }
  const kayit = await navigator.serviceWorker.getRegistration();
  if (!kayit) { alert('Uygulama henüz kurulmamış.'); return; }
  await kayit.update();
  alert(bekleyenSw ? 'Yeni sürüm indirildi. Yenile düğmesine bas.' : 'Uygulama güncel.');
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(kayit => {
      kayit.addEventListener('updatefound', () => {
        const yeni = kayit.installing;
        if (!yeni) return;
        yeni.addEventListener('statechange', () => {
          if (yeni.state === 'installed' && navigator.serviceWorker.controller) {
            bekleyenSw = yeni;
            document.getElementById('guncellemeBari').style.display = 'flex';
          }
        });
      });
    }).catch(e => console.warn('sw kaydedilemedi', e));

    let yenilendi = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (yenilendi) return;
      yenilendi = true;
      location.reload();
    });
  });
}
