<style>

    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;

  }
  header {

  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }

    max-width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;

  .container { padding: 12px; }

  /* Depot cards */
  .depot-grid { display: flex; flex-direction: column; gap: 10px; }
  .depot-card {

  .depot-card .name { font-size: 16px; font-weight: 600; }
  .depot-card .name input {

  .depot-card .stats { text-align: right; }
  .depot-card .stats .num { font-size: 20px; font-weight: 700; color: #1f3864; }
  .depot-card .stats .lbl { font-size: 11px; color: #888; }

  .section-title { font-size: 13px; font-weight: 700; color: #666; text-transform: uppercase;

  /* Stock list */
  .search-box { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #ddd;

  .group-header { background: #e8e8ee; padding: 6px 10px; font-size: 12px; font-weight: 700;

  .prod-row { background: #fff; border-radius: 10px; padding: 10px 12px; margin-bottom: 6px;

  .prod-row:active { background: #eef2fb; }

  /* Modal */

  .modal label { display: block; font-size: 12px; color: #777; margin: 12px 0 5px; font-weight: 600; }

  .save-btn { width: 100%; padding: 14px; border-radius: 10px; border: none; background: #1f3864;

  /* History */

  table.report-table th:first-child, table.report-table td:first-child { text-align: left; position: sticky; left: 0; background: #fff; }
  table.report-table thead th { background: #1f3864; color: #fff; position: sticky; top: 0; }

    table.report-table thead th { position: static; }

  #guncellemeBari {
    display: none; position: fixed; left: 12px; right: 12px; bottom: 88px;
    background: #1565c0; color: #fff; border-radius: 10px; padding: 12px 14px;

  .ayar-blok { background: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }

  .ayar-satir:last-child { border-bottom: none; }

  /* PIN ekrani */
  #pinEkrani {

  #pinEkrani input {

  #pinEkrani .pin-hata { color: #ffb4b4; font-size: 13px; margin-top: 12px; min-height: 18px; }
  #pinEkrani button {

  #pinEkrani button.ikincil {

  /* PIN karari verilene kadar uygulama icerigini orten perde.
     Bos beyaz ekran yerine ne beklendigini soyler. */
  #pinPerde {
    position: fixed; inset: 0; background: #1f3864; z-index: 99;

</style>

<body>

<header>
  <h1>Alkol Depo Takip</h1>
  <div class="sub" id="header-sub">3 depo &middot; Alibey Club</div>

</header>
<div id="offlineBar" style="display:none; background:#c62828; color:#fff; font-size:12px; text-align:center; padding:6px; position:sticky; top:56px; z-index:19;"></div>

<div class="container" id="app"></div>

<button class="fab" id="fabBtn">+</button>

<div id="guncellemeBari">
  <span>Yeni sürüm hazır.</span>
  <button onclick="guncellemeyiUygula()">Yenile</button>
</div>

<nav class="bottom">
  <button data-tab="depolar" class="active"><span class="icon">&#9673;</span>Depolar</button>
  <button data-tab="rapor"><span class="icon">&#9636;</span>Rapor</button>

  <button data-tab="ayarlar"><span class="icon">&#9881;</span>Ayarlar</button>
</nav>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="products.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyA3T0cLeSZK70In_RWcqkq3QEk8nzvBAJA",
  authDomain: "alkol-depo-takip.firebaseapp.com",
  databaseURL: "https://alkol-depo-takip-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "alkol-depo-takip",
  storageBucket: "alkol-depo-takip.firebasestorage.app",
  messagingSenderId: "861371573670",
  appId: "1:861371573670:web:d383c354807a76fc839b67"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ===== PIN dogrulama =====
async function sha256(metin) {
  const tampon = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(metin));
  return [...new Uint8Array(tampon)].map(b => b.toString(16).padStart(2, '0')).join('');
}

// Girilen PIN'in hash'i users icindeki 4 (ya da daha fazla/az) kayittan
// biriyle eslesiyor mu diye tarar. Eslesen olursa {id, ad, pinHash, rol}
// dondurur, yoksa null.
async function kullaniciEslesenPin(pin) {
  const ozet = await sha256(pin);
  const id = Object.keys(users).find(k => users[k] && users[k].pinHash === ozet);
  return id ? { id, ...users[id] } : null;
}

const PIN_HATIRLA_GUN = 30;
let mevcutKullanici = null;   // {id, ad, pinHash, rol} | null — giris sonrasi doldurulur
let users = {};   // {id: {ad, pinHash, rol}} — Gorev 2'de giris akisinda kullanilacak

function cihazDogrulanmisMi() {
  const zaman = Number(localStorage.getItem('pin_dogrulandi') || 0);
  if (!(zaman > 0 && (Date.now() - zaman) < PIN_HATIRLA_GUN * 86400000)) return false;
  // Hatirlanan kullanici hala var mi? Yonetici bu kullaniciyi sildiyse (Gorev 6)
  // eski cihaz kimligi artik gecersiz sayilir, yeniden PIN sorulur.
  const id = localStorage.getItem('cache_kullanici_id');
  if (!id || !users[id]) return false;
  mevcutKullanici = { id, ...users[id] };
  return true;
}

// ===== PIN kapisi =====
// render() kosulsuz calisiyordu; PIN karari ise onbellekte kullanici yokken
// db.ref('users').once('value') ile ASENKRON veriliyordu. Ag turu
// bitene kadar depo listesi gorunup tiklanabiliyor, o pencerede islem
// girilebiliyordu. Karar verilene kadar icerik perdeyle ortulur.
function pinPerdesiniGoster() {
  if (document.getElementById('pinPerde')) return;
  const perde = document.createElement('div');
  perde.id = 'pinPerde';
  perde.innerHTML = `
    <h2>Alkol Depo Takip</h2>
    <div class="alt">Güvenlik kontrolü yapılıyor…<br>Birkaç saniye sürebilir.</div>
  `;
  document.body.appendChild(perde);
}

function pinPerdesiniKaldir() {
  const perde = document.getElementById('pinPerde');
  if (perde) perde.remove();
}

// Her kosulda COZULUR: 'var' | 'yok' | 'bilinmiyor'. urunSunucuKontrolu ile
// ayni desen. KRITIK: RTDB'de once() sozu cevrimdisiyken HIC cozulmez — ne
// then ne catch calisir. Render'i bu soze cirilciplak baglamak, onbellekte
// ozet olmayan ve interneti olmayan bir cihazda uygulamayi SONSUZA DEK bos
// birakirdi (PIN kurulumunda tam olarak bu yasandi). Bu yuzden bekleyis
// surelidir: karar verilemezse kilitleme yonunde degil, SERBEST BIRAKMA
// yonunde basarisiz olunur.
const PIN_KONTROL_SURESI = 4000;

function kullaniciSunucuKontrolu() {
  return new Promise(cozumle => {
    let bitti = false;
    const bir = durum => { if (bitti) return; bitti = true; cozumle(durum); };
    // Baglanti olu iken sorgu hic cozulmez — beklemeye hic girme.
    // NOT: firebaseBagli burada KULLANILAMAZ; bu kapi sayfa yuklenirken,
    // o degiskenin `let` bildiriminden ONCE calisiyor (gecici olu bolge).
    if (!navigator.onLine) { bir('bilinmiyor'); return; }
    const sayac = setTimeout(() => bir('bilinmiyor'), PIN_KONTROL_SURESI);
    try {
      db.ref('users').once('value')
        .then(snap => { clearTimeout(sayac); bir(snap && snap.val() ? 'var' : 'yok'); })
        .catch(() => { clearTimeout(sayac); bir('bilinmiyor'); });
    } catch (e) {
      clearTimeout(sayac);
      bir('bilinmiyor');
    }
  });
}

// vazgecilebilir=true YALNIZCA ust basliktaki "Giris yap" etiketinden acilista
// verilir. Acilis kapisindan gelen cagrilar (vazgecilebilir yok) eskisi gibi
// kapatilamaz kalir. Vazgec dugmesi SART: #pinEkrani cikissiz tam ekran bir
// perde; kimliksiz acilmis cevrimdisi bir cihazda users bos olabilir ve o
// durumda hicbir PIN eslesmez — dugme olmasa kullanici kendi actigi ekranda
// kilitlenirdi. Kodun her yerindeki "kilitleme yonunde degil, serbest birakma
// yonunde basarisiz ol" kurali burada da gecerli.
function pinEkraniniGoster(vazgecilebilir) {
  if (document.getElementById('pinEkrani')) return;   // cift acilmayi engelle
  // Kapatilmis bir onceki ekrandan artakalan sayac, yeni ekranin kacis yolunu
  // kendi suresinden ONCE acabilirdi. Yeni ekran yeni bir bekleme baslatir.
  pinKacisSayaciniDurdur();
  const ekran = document.createElement('div');
  ekran.id = 'pinEkrani';
  ekran.innerHTML = `
    <h2>Alkol Depo Takip</h2>
    <div class="alt">Devam etmek için PIN gir</div>
    <input id="pinGirdi" type="password" inputmode="numeric" maxlength="4"
           autocomplete="off" enterkeyhint="done" placeholder="····">
    <div class="pin-hata" id="pinHata"></div>
    <button id="pinOnayBtn">Gir</button>
    ${vazgecilebilir ? '<button id="pinVazgecBtn" class="ikincil">Vazgeç</button>' : ''}
  `;
  document.body.appendChild(ekran);
  // Ekranin "iptal edilebilir mi" kimligi UZERINDE tasinir. Etiketten acilan
  // ekran her kosulda iptal edilebilir (ortada bir oturum yok, iptal kullaniciyi
  // bulundugu duruma dondurur). Kapidan acilan ekran ise iptal edilemez; ona
  // yalnizca users bos oldugu SURECE gecici bir kacis yolu eklenir ve veri
  // gelince o kacis yolu geri alinir (pinEkraniVeriDurumunuTazele).
  if (vazgecilebilir) {
    ekran.dataset.vazgecilebilir = '1';
    document.getElementById('pinVazgecBtn').addEventListener('click', () => ekran.remove());
  }

  const girdi = document.getElementById('pinGirdi');
  const hata = document.getElementById('pinHata');
  girdi.focus();

  async function onayla() {
    const kod = girdi.value.trim();
    if (!/^\d{4}$/.test(kod)) { hata.textContent = 'PIN 4 rakam olmalı.'; return; }
    // users HENUZ BOS olabilir: bu ekran acilis kapisinin 'var' dalinda da
    // aciliyor ve db.ref('users').on() dinleyicisi kapidan SONRA kaydoluyor.
    // O aralikta DOGRU bir PIN de eslesmez; "PIN hatali." demek kullaniciyi
    // yanlis bilgilendirmek olurdu. Durum oldugu gibi soylenir.
    if (Object.keys(users).length === 0) {
      hata.textContent = 'Kullanıcı listesi henüz yüklenmedi, PIN kontrol edilemiyor.';
      pinEkraniVeriDurumunuTazele();
      return;
    }
    const bulunan = await kullaniciEslesenPin(kod);
    if (!bulunan) {
      hata.textContent = 'PIN hatalı.';
      girdi.value = '';
      girdi.focus();
      return;
    }
    mevcutKullanici = bulunan;
    navYetkisiniUygula();
    localStorage.setItem('cache_kullanici_id', bulunan.id);
    localStorage.setItem('pin_dogrulandi', String(Date.now()));
    ekran.remove();
    // Giris ANINDA ekran mutlaka tazelenir. Once yalnizca bekleyenRenderiBosalt()
    // cagriliyordu; o da SADECE bekleyen bir render borcu varsa render ediyordu.
    // Borc yokken (cevrimdisi cihaz, onbellekten acilis) render() hic calismaz ve
    // ust basliktaki kullanici etiketi ile alt navigasyon yetkisi eski/gizli kalirdi.
    // Nav dugmesi tiklamasindaki desenin aynisi: ekran burada guncellendigi icin
    // bekleyen render borcu da KAPANIR.
    renderBekliyor = false;
    render();
  }

  document.getElementById('pinOnayBtn').addEventListener('click', onayla);
  girdi.addEventListener('keydown', e => { if (e.key === 'Enter') onayla(); });
  pinEkraniVeriDurumunuTazele();
}

// db.ref('users') dinleyicisi en az bir kez cevap verdi mi? "Veri henuz gelmedi"
// ile "sunucu BOS dondu" ayrimi buna dayanir; ikisine ayni mesaji yazmak
// kullaniciyi yanlis bilgilendirirdi.
let usersSunucudanGeldi = false;

// Bos users ile PIN ekraninda kalan kullaniciya kacis yolu acilmadan once
// beklenen sure. Acilis kapisindaki gecici yukleme penceresinin tek dokunusla
// atlanabilir olmamasi icin var.
const PIN_BEKLEME_KACIS_SURESI = 4000;
let pinKacisSayaci = null;

// Kullanici listesi gelmeden PIN denenmesin: dugme beklemede tutulur ve alt
// yazi DURUMU OLDUGU GIBI soyler. users dinleyicisi veriyi getirince yeniden
// cagrilir ve ekran normale doner.
//
// KACIS YOLU: acilis kapisindan acilan ekranda Vazgec dugmesi YOK. users bos
// gelirse Gir dugmesi devre disi kalir ve Enter yolu da bos-users dalinda
// takilir — ekran cikissiz bir perdeye donusurdu. Ek 2 ayni olayda (dis silme
// ya da okuma izni kaybi) GIRISLI kullaniciyi bilerek serbest birakiyor;
// girissiz kullanici da serbest birakilmalidir, yoksa iki duzeltme ters yone
// caliser. Kacis yolu bu yuzden burada olusturulur.
function pinKacisSayaciniDurdur() {
  if (pinKacisSayaci) { clearTimeout(pinKacisSayaci); pinKacisSayaci = null; }
}

function pinEkraniVeriDurumunuTazele() {
  const ekran = document.getElementById('pinEkrani');
  if (!ekran) { pinKacisSayaciniDurdur(); return; }
  const bos = Object.keys(users).length === 0;
  const btn = ekran.querySelector('#pinOnayBtn');
  const alt = ekran.querySelector('.alt');
  if (btn) { btn.disabled = bos; btn.style.opacity = bos ? '.5' : ''; }
  if (alt) alt.textContent = !bos
    ? 'Devam etmek için PIN gir'
    : (usersSunucudanGeldi
        ? 'Sunucuda tanımlı kullanıcı yok — PIN sorulamıyor.'
        : 'Kullanıcı listesi yükleniyor…');
  if (!bos) {
    // Ekran artik CEVAPLANABILIR: gecici kacis yolu ARTIK kalmamali, yoksa
    // sorulabilir bir PIN ekrani tek dokunusla atlanabilirdi. En ulasilabilir
    // yol bir yaris degil: sunucu bos dondu -> Vazgec acildi -> yonetici users'i
    // geri yazdi -> ekran iyilesti, dugme kaldi. Etiketten acilan ekranin
    // Vazgec'i KALIR; o dugme kacis artigi degil, ekranin dogal parcasi.
    if (ekran.dataset.vazgecilebilir !== '1') {
      const kacis = ekran.querySelector('#pinVazgecBtn');
      if (kacis) kacis.remove();
    }
    pinKacisSayaciniDurdur();
    return;
  }
  // Sunucu BOS dondu: eslesecek hicbir PIN yok, beklemenin anlami yok.
  if (usersSunucudanGeldi) { pinKacisSayaciniDurdur(); pinEkraniKacisYoluEkle(ekran); return; }
  // Henuz cevap yok: kisa bir sure beklenir, gelmezse yine de cikis acilir.
  // Sayac BIR KEZ kurulur. Onceden kosulsuz clearTimeout + yeniden kurma vardi;
  // onayla()'nin bos-users dali da buraya girdigi icin, sikisan kullanicinin en
  // olasi refleksi (4 hane yazip Enter'a basmak) kendi cikisini SURESIZ
  // erteliyordu — duzeltmenin amacina ters. Bekleme yalnizca gercekten yeni bir
  // bekleme baslarken kurulur.
  if (pinKacisSayaci) return;
  pinKacisSayaci = setTimeout(() => {
    pinKacisSayaci = null;
    const e2 = document.getElementById('pinEkrani');
    if (!e2 || Object.keys(users).length > 0) return;
    const alt2 = e2.querySelector('.alt');
    if (alt2) alt2.textContent = 'Kullanıcı listesi alınamadı — PIN sorulamıyor.';
    pinEkraniKacisYoluEkle(e2);
  }, PIN_BEKLEME_KACIS_SURESI);
}

function pinEkraniKacisYoluEkle(ekran) {
  if (ekran.querySelector('#pinVazgecBtn')) return;   // zaten var
  const btn = document.createElement('button');
  btn.id = 'pinVazgecBtn';
  btn.className = 'ikincil';
  btn.textContent = 'Vazgeç';
  btn.addEventListener('click', () => ekran.remove());
  ekran.appendChild(btn);
}

// Ust basliktaki etiketin isleyicisi. Etiket iki durum tasir: girisli kullanici
// ("👤 Ad" -> cikis) ve kimliksiz acilis ("👤 Giris yap" -> giris).
// Acilis kapisi karar veremediginde (cevrimdisi ilk acilis) mevcutKullanici null
// kalir ve uygulama personel yetkisiyle acilir; o durumda cikilacak bir oturum
// yoktur, onay sorulmadan dogrudan giris akisi baslatilir. Bu dal olmadan
// kimliksiz acilan cihazda giris yapmanin TEK yolu sayfayi yeniden yuklemekti.
function kullaniciCikisYap() {
  if (!mevcutKullanici) { pinEkraniniGoster(true); return; }
  if (!confirm('Çıkış yapılsın mı?')) return;
  localStorage.removeItem('pin_dogrulandi');
  localStorage.removeItem('cache_kullanici_id');
  location.reload();
}

function fmtNum(n) {
  n = Number(n) || 0;
  return n % 1 === 0 ? n.toString() : n.toFixed(2);
}

function escapeHtml(deger) {
  return String(deger == null ? '' : deger)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Arama karsilastirmalari icin metni yerel ayardan BAGIMSIZ olarak ASCII'ye katlar.
// toLocaleLowerCase('tr') KULLANILMAZ: 'BIRA' -> 'bira' olmali, 'bira' degil.
// Sabit katalogdaki 322 urun ASCII (BIRA/LIKOR/SISE), kullanici verisi ise
// Turkce karakterli olabildigi icin iki yon de ayni ASCII tabanda bulusmali.
const ARAMA_KATLAMA = {
  'İ': 'i', 'I': 'i', 'ı': 'i', 'i': 'i',
  'Ş': 's', 'ş': 's',
  'Ğ': 'g', 'ğ': 'g',
  'Ü': 'u', 'ü': 'u',
  'Ö': 'o', 'ö': 'o',
  'Ç': 'c', 'ç': 'c'
};

function aramaNormali(deger) {
  return String(deger == null ? '' : deger)
    .replace(/[İIıiŞşĞğÜüÖöÇç]/g, ch => ARAMA_KATLAMA[ch])
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')   // 'İ'den arta kalan U+0307 dahil tum birlesen isaretler
    .toLowerCase();
}

function prodMap() {
  const m = {};
  PRODUCTS.forEach(p => m[p[0]] = p);
  Object.keys(customProducts).forEach(kod => {
    const c = customProducts[kod];
    if (!c || typeof c.ad !== 'string' || typeof c.birim !== 'string' || typeof c.grup !== 'string') return;
    m[kod] = [kod, c.ad, c.birim, c.grup];
  });
  return m;
}

// Depo adi uzunluk siniri. Sinir YALNIZCA depoEkle'de olsaydi ise yaramazdi:
// kullanici kisa adla ekleyip renameDepot ile istedigi kadar uzun ada
// cevirebilirdi. Iki giris noktasinda da zorlanir.
const DEPO_ADI_MAX = 40;

// Kullanici adi uzunluk siniri — DEPO_ADI_MAX ile ayni desen, ayni gerekce:
// sinir yalnizca kullaniciEkle'de olsaydi kisa adla eklenip kullaniciDuzenle
// ile uzatilabilirdi. Iki giris noktasinda da zorlanir. Ust basliktaki
// #kullanici-etiket ayrica CSS ile kirpilir; bu sinir veriyi, kirpma gorunumu
// korur — biri digerinin yerine gecmez.
const KULLANICI_ADI_MAX = 40;

function renameDepot(id, val) {
  if (!mevcutKullanici || mevcutKullanici.rol !== 'yonetici') { alert('Bu işlem için yönetici yetkisi gerekir.'); return; }
  // Sinir yalnizca kullanicinin GERCEKTEN yazdigi degere uygulanir. Kutu
  // bosaltilip varsayilana/mevcut ada dusulduyse (asagidaki fallback), o ad
  // zaten kayitliydi — belki bu sinir eklenmeden once, 40 karakterden uzun.
  // Fallback SONRASI uzunluga bakmak, kullanicinin hic yazmadigi bir
  // uzunluk yuzunden kafa karistirici bir "45 karakter girdiniz" reddine yol acardi.
  const girilen = val.trim();
  if (girilen && girilen.length > DEPO_ADI_MAX) {
    alert(`Depo adı en fazla ${DEPO_ADI_MAX} karakter olabilir (girilen: ${girilen.length}).\n\nAd değiştirilmedi.`);
    render();   // kutudaki uzun metin geri alinip kayitli ad gosterilir
    return;
  }
  val = girilen || DEFAULT_DEPOTS[id] || depots[id];
  // Isim cakismasi: depoEkle ayni adi engelliyordu ama renameDepot
  // engellemiyordu; bir depo baska bir deponun adina cevrilebiliyor, ikisi
  // raporda ve rapor tablosunda ayirt edilemez hale geliyordu. Kendi adina
  // dokunmak serbest (ayni id haric tutulur).
  if (Object.keys(depots).some(d => d !== id && String(depots[d]).toLowerCase() === val.toLowerCase())) {
    alert(`"${val}" adında başka bir depo zaten var.\n\nAd değiştirilmedi.`);
    render();   // kutudaki cakisan metin geri alinip kayitli ad gosterilir
    return;
  }
  depots[id] = val;
  // Onbellek de yazilir: yoksa cevrimdisi yapilan ad degisikligi yeniden
  // acilista eski ada donerdi (sunucuya yazma cevrimdisi cozulmez).
  saveCache();
  // Basari yolunda da render(): baslikta "N depo" ve rapor tablosu bir
  // sonraki render'a kadar eski adi gosterebilirdi.
  render();
  db.ref('depots/' + id).set(val)
    .catch(e => console.warn('depo adi sunucuya yazilamadi', e));
}

function renderDepotBody() {
  const id = openDepotDetail;
  const govde = document.getElementById('depotBody');
  if (!govde) return;
  const items = stock[id] || {};
  const pm = prodMap();
  let html = '';

  if (depotSearchQuery.trim().length >= 2) {
    const q = aramaNormali(depotSearchQuery.trim());
    const eslesenler = Object.values(pm)
      .filter(p => aramaNormali(p[1]).includes(q) || aramaNormali(p[0]).includes(q))
      .slice(0, 40);
    if (eslesenler.length === 0) {
      html = `<div class="empty-state">Sonuç bulunamadı.</div>`;
    } else {
      eslesenler.forEach(p => {
        const adet = items[p[0]] || 0;
        html += `<div class="prod-row" data-eylem="urunDokun" data-depo="${escapeHtml(id)}" data-kod="${escapeHtml(p[0])}">
          <div class="info"><div class="pname">${escapeHtml(p[1])}</div><div class="pcode">${escapeHtml(p[0])}</div></div>
          <div class="pqty">${fmtNum(adet)}<div class="unit">${escapeHtml(p[2])}</div></div>
        </div>`;
      });
    }
    govde.innerHTML = html;
    return;
  }

  const kodlar = Object.keys(items).filter(k => items[k] !== 0);
  if (kodlar.length === 0) {
    govde.innerHTML = `<div class="empty-state">Bu depoda henüz stok kaydı yok.<br>Yukarıdan ürün arayıp ekleyebilir ya da sağ alttaki + butonunu kullanabilirsin.</div>`;
    return;
  }

  const gruplu = {};
  kodlar.forEach(k => {
    const grup = pm[k] ? pm[k][3] : 'DİĞER';
    (gruplu[grup] = gruplu[grup] || []).push(k);
  });

  Object.keys(gruplu).sort().forEach(grup => {
    html += `<div class="group-header">${escapeHtml(grup)}</div>`;
    gruplu[grup]
      .sort((a, b) => (pm[a] ? pm[a][1] : a).localeCompare(pm[b] ? pm[b][1] : b))
      .forEach(k => {
        const ad = pm[k] ? pm[k][1] : k;
        const birim = pm[k] ? pm[k][2] : '';
        html += `<div class="prod-row" data-eylem="urunDokun" data-depo="${escapeHtml(id)}" data-kod="${escapeHtml(k)}">
          <div class="info"><div class="pname">${escapeHtml(ad)}</div><div class="pcode">${escapeHtml(k)}</div></div>
          <div class="pqty">${fmtNum(items[k])}<div class="unit">${escapeHtml(birim)}</div></div>
        </div>`;
      });
  });
  govde.innerHTML = html;
}

function renderReportBody() {
  const govde = document.getElementById('reportBody');
  if (!govde) return;
  const pm = prodMap();
  const depotIds = Object.keys(depots);

  // hangi ürün kodları herhangi bir depoda stoklu
  const allCodes = new Set();
  depotIds.forEach(id => Object.keys(stock[id] || {}).forEach(k => {
    if ((stock[id][k] || 0) !== 0) allCodes.add(k);
  }));

  let codes = [...allCodes];
  const q = aramaNormali(reportSearchQuery.trim());
  if (q) {
    codes = codes.filter(k => {
      const p = pm[k];
      return aramaNormali(p ? p[1] : k).includes(q) || aramaNormali(k).includes(q);
    });
  }

  const grouped = {};
  codes.forEach(k => {
    const p = pm[k];
    const grup = p ? p[3] : 'DİĞER';
    if (!grouped[grup]) grouped[grup] = [];
    grouped[grup].push(k);
  });

  let html = '';
  if (codes.length === 0) {
    html = `<div class="empty-state">Gösterilecek stok kaydı yok.</div>`;
  } else {
    html = `<div class="report-table-wrap"><table class="report-table"><thead><tr>
      <th>Ürün</th>${depotIds.map(id => `<th>${escapeHtml(depots[id])}</th>`).join('')}<th>Toplam</th>
    </tr></thead><tbody>`;
    Object.keys(grouped).sort().forEach(grup => {
      html += `<tr class="grp"><td colspan="${depotIds.length + 2}">${escapeHtml(grup)}</td></tr>`;
      grouped[grup].sort((a,b) => {
        const pa = pm[a], pb = pm[b];
        return (pa?pa[1]:a).localeCompare(pb?pb[1]:b);
      }).forEach(k => {
        const p = pm[k];
        const name = p ? p[1] : k;
        const unit = p ? p[2] : '';
        let total = 0;
        const cells = depotIds.map(id => {
          const v = (stock[id] && stock[id][k]) || 0;
          total += v;
          return `<td>${v ? fmtNum(v) : '-'}</td>`;
        }).join('');
        html += `<tr><td>${escapeHtml(name)} <span style="color:#999;font-weight:400;">(${escapeHtml(unit)})</span></td>${cells}<td class="tot">${fmtNum(total)}</td></tr>`;
      });
    });
    html += `</tbody></table></div>`;
  }
  govde.innerHTML = html;
}

function exportReportCsv() {
  if (!mevcutKullanici || mevcutKullanici.rol !== 'yonetici') { alert('Bu işlem için yönetici yetkisi gerekir.'); return; }
  const pm = prodMap();
  const depotIds = Object.keys(depots);

  const allCodes = new Set();
  depotIds.forEach(id => Object.keys(stock[id] || {}).forEach(k => {
    if ((stock[id][k] || 0) !== 0) allCodes.add(k);
  }));
  const codes = [...allCodes].sort((a,b) => {
    const pa = pm[a], pb = pm[b];
    return (pa?pa[1]:a).localeCompare(pb?pb[1]:b);
  });

  const headers = ['Kod','Ürün Adı','Birim','Grup', ...depotIds.map(id => depots[id]), 'Toplam'];
  const rows = [headers];
  codes.forEach(k => {
    const p = pm[k];
    const name = p ? p[1] : k;
    const unit = p ? p[2] : '';
    const grup = p ? p[3] : '';
    let total = 0;
    const vals = depotIds.map(id => {
      const v = (stock[id] && stock[id][k]) || 0;
      total += v;
      return fmtNum(v);
    });
    rows.push([k, name, unit, grup, ...vals, fmtNum(total)]);
  });

  const csv = rows.map(r => r.map(cell => {
    let s = String(cell).replace(/"/g, '""');
    // Excel/Sheets'te formul olarak calismasin diye =, +, -, @ ile baslayan
    // hucreler kacisli tek tirnakla basliyor (CSV formul enjeksiyonu) —
    // saf sayisal hucreler (orn. negatif stok toplami) haric tutulur,
    // yoksa raporun kendi rakamlari metne donup toplam bozulur
    const sayisalMi = /^-?\d+(?:\.\d+)?$/.test(s);
    if (!sayisalMi && /^[=+\-@\t\r]/.test(s)) s = `'${s}`;
    return /[",;\n]/.test(s) ? `"${s}"` : s;
  }).join(';')).join('\r\n');

  const dateStr = new Date().toISOString().slice(0,10);
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Stok_Raporu_${dateStr}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function gecmisiSuz() {
  const simdi = Date.now();
  const sinir = gecmisAralik === 'tumu' ? 0 : simdi - Number(gecmisAralik) * 86400000;

  return transactions.filter(tx => {
    if (tx.ts < sinir) return false;
    if (gecmisTur !== 'tumu' && tx.type !== gecmisTur) return false;
    if (gecmisDepo !== 'tumu') {
      const ilgili = tx.type === 'transfer'
        ? (tx.fromDepot === gecmisDepo || tx.toDepot === gecmisDepo)
        : tx.depotId === gecmisDepo;
      if (!ilgili) return false;
    }
    return true;
  }).sort((a, b) => b.ts - a.ts);
}

// Geri alinmislik yalnizca tx.reverted bayragindan turetilemez: bayrak .catch()'siz
// tek bir set() yazmasina bagli ve RTDB web SDK'sinda bekleyen yazmalarin disk
// kaliciligi yok. Cevrimdisi geri almada ters kayit dayanikli pending_queue'ya
// yazilirken bayrak yalnizca bellekte kalir; uygulama kapanirsa bayrak kaybolur,
// ters kayit sag kalir ve ayni islem ikinci kez geri alinabilir.
// Bu yuzden gercek, ters kaydin kendisinden (revertOf) turetiliyor — ters kayit
// dayanikli kuyruktan gectigi icin bu kendi kendini onarir.
function geriAlinanIdKumesi() {
  const kume = new Set();
  transactions.forEach(t => { if (t && t.revertOf) kume.add(t.revertOf); });
  getQueue().forEach(q => { if (q && q.revertOf) kume.add(q.revertOf); });
  return kume;
}

function geriAlinmisMi(tx, kume) {
  if (!tx) return false;
  if (tx.reverted) return true;
  if (!tx.id) return false;
  return (kume || geriAlinanIdKumesi()).has(tx.id);
}

function renderHistoryBody() {
  const govde = document.getElementById('historyBody');
  if (!govde) return;
  const kayitlar = gecmisiSuz();
  const tersKume = geriAlinanIdKumesi();

  if (kayitlar.length === 0) {
    govde.innerHTML = `<div class="empty-state">${
      transactions.length === 0 ? 'Henüz işlem kaydı yok.' : 'Bu filtrelere uyan işlem yok.'
    }</div>`;
    return;
  }

  let html = '';
  kayitlar.slice(0, 100).forEach(tx => {
    const d = new Date(tx.ts);
    const dateStr = d.toLocaleDateString('tr-TR') + ' ' + d.toLocaleTimeString('tr-TR', {hour:'2-digit',minute:'2-digit'});
    let badge, desc;
    if (tx.type === 'giris') {
      badge = `<span class="tx-badge tx-giris">GİRİŞ</span>`;
      desc = `${escapeHtml(depots[tx.depotId] || tx.depotId)}`;
    } else if (tx.type === 'cikis') {
      badge = `<span class="tx-badge tx-cikis">ÇIKIŞ</span>`;
      desc = `${escapeHtml(depots[tx.depotId] || tx.depotId)}`;
    } else {
      badge = `<span class="tx-badge tx-transfer">TRANSFER</span>`;
      desc = `${escapeHtml(depots[tx.fromDepot] || tx.fromDepot)} &rarr; ${escapeHtml(depots[tx.toDepot] || tx.toDepot)}`;
    }
    const pending = tx.localId && getQueue().some(q => q.localId === tx.localId);
    const geriAlmaKaydi = !!tx.revertOf;
    const geriAlinmis = geriAlinmisMi(tx, tersKume);
    const dugme = (!geriAlmaKaydi && !geriAlinmis && tx.id && !pending)
      ? `<button class="tx-undo" data-eylem="geriAl" data-tx="${escapeHtml(tx.id)}">Geri al</button>`
      : '';
    const isaret = geriAlinmis ? ' <span class="tx-badge tx-revert-badge">GERİ ALINDI</span>' : '';
    html += `<div class="tx-row${geriAlinmis ? ' tx-reverted' : ''}">
      <div class="tx-top">${badge}${isaret}<span style="font-size:13px;font-weight:700;">${fmtNum(tx.miktar)} ${escapeHtml(tx.birim||'')}</span></div>
      <div class="tx-name">${escapeHtml(tx.ad)}</div>
      <div class="tx-meta">${desc} &middot; ${dateStr}${tx.note ? ' &middot; '+escapeHtml(tx.note) : ''}${tx.kullaniciAdi ? ' &middot; '+escapeHtml(tx.kullaniciAdi) : ''}${pending ? ' &middot; <span style=\'color:#c62828;font-weight:600;\'>gönderiliyor...</span>' : ''}</div>
      ${dugme}
    </div>`;
  });
  govde.innerHTML = html;
}

function depoEkle() {
  if (!mevcutKullanici || mevcutKullanici.rol !== 'yonetici') { alert('Bu işlem için yönetici yetkisi gerekir.'); return; }
  const ad = (prompt('Yeni deponun adı:') || '').trim();
  if (!ad) return;
  if (ad.length > DEPO_ADI_MAX) {
    alert(`Depo adı en fazla ${DEPO_ADI_MAX} karakter olabilir (girilen: ${ad.length}).\n\nDepo eklenmedi.`);
    return;
  }
  // String(): veritabani acikca yazilabilir oldugundan bir depo adi dogrudan
  // Firebase'e sayi/bool olarak yazilmis olabilir — renameDepot'taki ayni
  // savunma burada da uygulanir.
  if (Object.values(depots).some(d => String(d).toLowerCase() === ad.toLowerCase())) {
    alert('Bu adda bir depo zaten var.');
    return;
  }
  // Yalniz Date.now() yetmiyor: ayni milisaniyede eklenen iki depo ayni id'yi
  // alip birbirinin uzerine yaziyordu. localId uretimindeki desen uygulanir.
  const id = 'depo_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  depots[id] = ad;
  if (!stock[id]) stock[id] = {};
  db.ref('depots/' + id).set(ad)
    .catch(e => console.warn('yeni depo sunucuya yazilamadi', e));
  saveCache();
  render();
}

async function kullaniciEkle() {
  if (!mevcutKullanici || mevcutKullanici.rol !== 'yonetici') { alert('Bu işlem için yönetici yetkisi gerekir.'); return; }
  const ad = (prompt('Yeni kullanıcının adı:') || '').trim();
  if (!ad) return;
  if (ad.length > KULLANICI_ADI_MAX) {
    alert(`Kullanıcı adı en fazla ${KULLANICI_ADI_MAX} karakter olabilir (girilen: ${ad.length}).\n\nKullanıcı eklenmedi.`);
    return;
  }
  if (Object.values(users).some(u => String(u.ad).toLowerCase() === ad.toLowerCase())) {
    alert('Bu adda bir kullanıcı zaten var.');
    return;
  }
  const rolGirdi = (prompt('Rol — yonetici / personel:', 'personel') || '').trim().toLowerCase();
  if (!['yonetici', 'personel'].includes(rolGirdi)) { alert('Rol "yonetici" ya da "personel" olmalı.'); return; }
  const pin = (prompt('4 haneli PIN:') || '').trim();
  if (!/^\d{4}$/.test(pin)) { alert('PIN 4 rakam olmalı.'); return; }
  const pinHash = await sha256(pin);
  // Ayni PIN'e sahip ikinci bir kullanici IZ KAYDININ TAMAMINI curutur:
  // kullaniciEslesenPin, users icinde ILK eslesen kaydi dondurur. Yeni kullanici
  // kendi PIN'iyle girdigini sanip BASKA birinin kimligiyle oturum acar — o
  // kisinin ROLUNU de devralir (personel, yonetici olabilir) ve tum islemleri
  // o kisinin adina kaydolur.
  // Uyari hangi kullanicinin PIN'i oldugunu SOYLEMEZ: soylemek, ekranin basindaki
  // yoneticiye baskasinin PIN'ini deneme-yanilma ile dogrulama imkani verirdi.
  if (Object.values(users).some(u => u.pinHash === pinHash)) {
    alert('Bu PIN başka bir kullanıcıda kullanılıyor. Lütfen başka bir PIN seçin.');
    return;
  }
  const id = 'kullanici_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  users[id] = { ad, pinHash, rol: rolGirdi };
  db.ref('users/' + id).set({ ad, pinHash, rol: rolGirdi })
    .catch(e => console.warn('yeni kullanici sunucuya yazilamadi', e));
  saveCache();
  render();
}

async function kullaniciDuzenle(id) {
  if (!mevcutKullanici || mevcutKullanici.rol !== 'yonetici') { alert('Bu işlem için yönetici yetkisi gerekir.'); return; }
  const kullanici = users[id];
  if (!kullanici) return;
  const yeniAd = (prompt('Ad:', kullanici.ad) || '').trim();
  if (!yeniAd) return;
  if (yeniAd.length > KULLANICI_ADI_MAX) {
    alert(`Kullanıcı adı en fazla ${KULLANICI_ADI_MAX} karakter olabilir (girilen: ${yeniAd.length}).\n\nKullanıcı değiştirilmedi.`);
    return;
  }
  if (Object.keys(users).some(k => k !== id && String(users[k].ad).toLowerCase() === yeniAd.toLowerCase())) {
    alert('Bu adda başka bir kullanıcı zaten var.');
    return;
  }
  const yeniRol = (prompt('Rol — yonetici / personel:', kullanici.rol) || '').trim().toLowerCase();
  if (!['yonetici', 'personel'].includes(yeniRol)) { alert('Rol "yonetici" ya da "personel" olmalı.'); return; }
  if (yeniRol !== 'yonetici' && kullanici.rol === 'yonetici') {
    const yoneticiSayisi = Object.values(users).filter(u => u.rol === 'yonetici').length;
    if (yoneticiSayisi <= 1) { alert('Son yönetici personele düşürülemez — önce başka bir yönetici ekleyin.'); return; }
  }
  const yeniPinGirdi = (prompt('Yeni PIN (4 rakam) — değiştirmemek için boş bırak:') || '').trim();
  let pinHash = kullanici.pinHash;
  if (yeniPinGirdi) {
    if (!/^\d{4}$/.test(yeniPinGirdi)) { alert('PIN 4 rakam olmalı.'); return; }
    pinHash = await sha256(yeniPinGirdi);
    // kullaniciEkle'deki ayni gerekce. KENDI kaydi haric tutulur: kullanici
    // kendi mevcut PIN'ini yeniden yazabilmeli, bu bir cakisma degildir.
    if (Object.keys(users).some(k => k !== id && users[k].pinHash === pinHash)) {
      alert('Bu PIN başka bir kullanıcıda kullanılıyor. Lütfen başka bir PIN seçin.');
      return;
    }
  }
  users[id] = { ad: yeniAd, pinHash, rol: yeniRol };
  db.ref('users/' + id).set({ ad: yeniAd, pinHash, rol: yeniRol })
    .catch(e => console.warn('kullanici guncellemesi sunucuya yazilamadi', e));
  // navYetkisiniUygula() SART: kendini personele dusuren yoneticide render()
  // tek basina alt navigasyonu tazelemiyordu — mevcutKullanici.rol 'personel'
  // olmasina ragmen dort sekme gorunur kaliyor, ancak users dinleyicisi
  // tetiklendiginde bire dusuyordu. Cevrimdisi cihazda o dinleyici hic
  // tetiklenmez ve sekmeler kalici olarak yanlis gorunur.
  if (mevcutKullanici.id === id) {
    mevcutKullanici = { id, ad: yeniAd, pinHash, rol: yeniRol };
    navYetkisiniUygula();
  }
  saveCache();
  render();
}

function kullaniciSil(id) {
  if (!mevcutKullanici || mevcutKullanici.rol !== 'yonetici') { alert('Bu işlem için yönetici yetkisi gerekir.'); return; }
  const kullanici = users[id];
  if (!kullanici) return;
  if (mevcutKullanici.id === id) { alert('Şu an giriş yapmış olduğunuz hesabı silemezsiniz.'); return; }
  if (kullanici.rol === 'yonetici') {
    const yoneticiSayisi = Object.values(users).filter(u => u.rol === 'yonetici').length;
    if (yoneticiSayisi <= 1) { alert('Son yönetici silinemez.'); return; }
  }
  if (!confirm(`"${kullanici.ad}" silinsin mi?`)) return;
  delete users[id];
  db.ref('users/' + id).remove()
    .catch(e => console.warn('kullanici sunucudan silinemedi', e));
  saveCache();
  render();
}

function depoSil(id) {
  if (!mevcutKullanici || mevcutKullanici.rol !== 'yonetici') { alert('Bu işlem için yönetici yetkisi gerekir.'); return; }
  if (DEFAULT_DEPOTS[id]) { alert('Varsayılan depolar silinemez.'); return; }
  const dolu = Object.values(stock[id] || {}).some(v => v !== 0);

    .catch(e => console.warn('depo stogu sunucudan silinemedi', e));

}

function urunEkle() {
  if (!mevcutKullanici || mevcutKullanici.rol !== 'yonetici') { alert('Bu işlem için yönetici yetkisi gerekir.'); return; }
  const kod = (prompt('Ürün kodu (örn: ICB09000001):') || '').trim().toUpperCase();
  if (!kod) return;
  if (!/^[A-Z0-9_-]{3,32}$/.test(kod)) { alert('Ürün kodu yalnızca büyük harf, rakam, - ve _ içerebilir (3-32 karakter).'); return; }
  if (prodMap()[kod]) { alert('Bu kod zaten kayıtlı: ' + prodMap()[kod][1]); return; }

  const ad = (prompt('Ürün adı:') || '').trim();
  if (!ad) return;

  const birim = (prompt('Birim — bot / kol / fic / lt:', 'bot') || '').trim().toLowerCase();
  if (!['bot', 'kol', 'fic', 'lt'].includes(birim)) { alert('Birim bot, kol, fic ya da lt olmalı.'); return; }

  const gruplar = [...new Set(Object.values(prodMap()).map(p => p[3]))].sort();
  const grup = (prompt('Grup:\n\n' + gruplar.join('\n'), gruplar[0]) || '').trim().toUpperCase();
  if (!grup) return;

  const kayit = { ad, birim, grup };

  // Sunucu tarafi cakisma kontrolu SURELIDIR ve akisi ASLA bloke etmez.
  // KRITIK: Firebase RTDB'de once()/set()/transaction() sozleri SUNUCU ONAYI
  // gelince cozulur; cevrimdisiyken HIC cozulmezler. Bu akis sunucuyu await
  // etseydi, internetin normalde olmadigi depo alaninda "Urun Ekle" sonsuza
  // dek donardi (PIN kurulumunda tam olarak bu yasandi). Bu yuzden kontrol
  // zaman asimlidir: cevap gelmezse yerel karara guvenilip devam edilir ve
  // kullaniciya kontrolun YAPILAMADIGI acikca soylenir.
  urunSunucuKontrolu(kod).then(durum => {
    if (durum === 'var') {
      alert(`Bu kod sunucuda zaten kayıtlı: ${kod}\n\nBaşka bir cihaz aynı kodu daha önce eklemiş. Mevcut kayıt korundu, "${ad}" EKLENMEDİ.\n\nFarklı bir kod kullanın.`);
      return;
    }
    urunuYaz(kod, kayit, durum === 'bilinmiyor');
  }).catch(e => {
    // Buraya dusmemesi gerekir (urunSunucuKontrolu her kosulda cozulur), ama
    // sessiz kalinirsa kullanici urunun eklenip eklenmedigini hic ogrenemez.
    console.warn('urun ekleme akisi hata verdi', e);
    alert('Ürün eklenemedi — beklenmeyen bir hata oluştu. Lütfen tekrar deneyin.');
  });
}

// Her kosulda COZULUR: 'var' | 'yok' | 'bilinmiyor'. 'bilinmiyor' = sunucuya
// sorulamadi (cevrimdisi ya da cevap zamaninda gelmedi).
const URUN_KONTROL_SURESI = 4000;

function urunSunucuKontrolu(kod) {
  return new Promise(cozumle => {
    let bitti = false;
    const bir = durum => { if (bitti) return; bitti = true; cozumle(durum); };
    // Baglanti olu iken sorgu hic cozulmez — beklemeye hic girme.
    if (!navigator.onLine || !firebaseBagli) { bir('bilinmiyor'); return; }
    const sayac = setTimeout(() => bir('bilinmiyor'), URUN_KONTROL_SURESI);
    try {
      db.ref('customProducts/' + kod).once('value')
        .then(snap => { clearTimeout(sayac); bir(snap && snap.exists() ? 'var' : 'yok'); })
        .catch(() => { clearTimeout(sayac); bir('bilinmiyor'); });
    } catch (e) {
      clearTimeout(sayac);
      bir('bilinmiyor');
    }
  });
}

// Yazma set() ile DEGIL transaction() ile yapilir: set() son yazani kazandirip
// mevcut kaydi sessizce siler. transaction'in guncelleme islevi undefined
// dondugunde yazma IPTAL edilir, yani var olan kaydin uzerine hicbir kosulda
// yazilmaz. Cevrimdisi baslatilan transaction baglanti gelince sunucu degeriyle
// YENIDEN calisir; o anda kod baskasi tarafindan alinmissa kendiliginden iptal
// olur. Soz beklenmez (cevrimdisi hic cozulmez) — kullanici geri bildirimi
// hemen verilir, gec ortaya cikan cakisma ayrica bildirilir.
function urunuYaz(kod, kayit, kontrolYapilamadi) {
  db.ref('customProducts/' + kod).transaction(mevcut => {
    if (mevcut) return undefined;   // iptal: mevcut kayit korunur
    return kayit;
  }).then(sonuc => {
    if (sonuc && sonuc.committed === false) {
      alert(`"${kayit.ad}" eklenemedi: ${kod} kodu sunucuda başka bir kayıt tarafından kullanılıyor.\n\nMevcut kayıt korundu, hiçbir şeyin üzerine yazılmadı. Farklı bir kod kullanın.`);
    }
  }).catch(e => console.warn('yeni urun sunucuya yazilamadi', e));

  if (kontrolYapilamadi) {
    alert(`"${kayit.ad}" kaydedildi.\n\nİnternet olmadığı için bu kodun başka bir cihazda kullanılıp kullanılmadığı sunucuda KONTROL EDİLEMEDİ. Bağlantı gelince kontrol edilecek; kod başkası tarafından alınmışsa mevcut kayıt korunur, bu ekleme uygulanmaz ve size bildirilir.`);
  } else {
    alert(`"${kayit.ad}" eklendi.`);
  }
}

// Personel yalnizca Depolar sekmesini gorur/kullanir — alt navigasyonda
// diger uc dugme hic render edilmez (arayuz katmani). Fonksiyon katmani
// (asagidaki alti fonksiyona eklenen rol kontrolu) ayni siniri, konsoldan
// dogrudan cagrilsa bile korur.
function navYetkisiniUygula() {
  const yoneticiMi = !!mevcutKullanici && mevcutKullanici.rol === 'yonetici';
  document.querySelectorAll('nav.bottom button').forEach(btn => {
    btn.style.display = (btn.dataset.tab === 'depolar' || yoneticiMi) ? '' : 'none';
  });
  if (!yoneticiMi && currentTab !== 'depolar') {
    currentTab = 'depolar';
    document.querySelectorAll('nav.bottom button').forEach(b => b.classList.remove('active'));
    const depolarBtn = document.querySelector('nav.bottom button[data-tab="depolar"]');
    if (depolarBtn) depolarBtn.classList.add('active');
  }
}
