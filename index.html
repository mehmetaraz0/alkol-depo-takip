<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: #f2f2f5; color: #1a1a1a; padding-bottom: 76px;
  }
  header {
    background: #1f3864; color: #fff; padding: 16px 16px 14px;
    position: sticky; top: 0; z-index: 20;
  }
  header h1 { margin: 0; font-size: 18px; font-weight: 600; }
  header .sub { font-size: 12px; opacity: .75; margin-top: 2px; }

  .container { padding: 12px; }

  /* Depot cards */
  .depot-grid { display: flex; flex-direction: column; gap: 10px; }
  .depot-card {
    background: #fff; border-radius: 12px; padding: 14px 16px;
    display: flex; justify-content: space-between; align-items: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.08); cursor: pointer;
  }
  .depot-card .name { font-size: 16px; font-weight: 600; }
  .depot-card .name input {
    font-size: 16px; font-weight: 600; border: none; background: transparent;
    border-bottom: 1px dashed #bbb; width: 140px; padding: 0;
  }
  .depot-card .stats { text-align: right; }
  .depot-card .stats .num { font-size: 20px; font-weight: 700; color: #1f3864; }
  .depot-card .stats .lbl { font-size: 11px; color: #888; }

  .section-title { font-size: 13px; font-weight: 700; color: #666; text-transform: uppercase;
    letter-spacing: .04em; margin: 18px 4px 8px; }

  /* Stock list */
  .search-box { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid #ddd;
    font-size: 15px; margin-bottom: 10px; background: #fff; }
  .group-header { background: #e8e8ee; padding: 6px 10px; font-size: 12px; font-weight: 700;
    color: #444; border-radius: 6px; margin: 10px 0 4px; }
  .prod-row { background: #fff; border-radius: 10px; padding: 10px 12px; margin-bottom: 6px;
    display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .prod-row:active { background: #eef2fb; }
  .prod-row .info { flex: 1; min-width: 0; }
  .prod-row .pname { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; }
  .prod-row .pcode { font-size: 11px; color: #999; }
  .prod-row .pqty { font-size: 16px; font-weight: 700; color: #1f3864; min-width: 60px; text-align: right; }
  .prod-row .pqty .unit { font-size: 11px; font-weight: 400; color: #999; }

  /* Bottom nav */
  nav.bottom {
    position: fixed; bottom: 0; left: 0; right: 0; background: #fff;
    border-top: 1px solid #e0e0e0; display: flex; z-index: 30;
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.bottom button {
    flex: 1; background: none; border: none; padding: 10px 0 8px; font-size: 11px;
    color: #999; display: flex; flex-direction: column; align-items: center; gap: 3px;
  }
  nav.bottom button.active { color: #1f3864; font-weight: 700; }
  nav.bottom .icon { font-size: 20px; }

  /* FAB */
  .fab {
    position: fixed; bottom: 76px; right: 16px; width: 56px; height: 56px; border-radius: 50%;
    background: #C00000; color: #fff; border: none; font-size: 28px; box-shadow: 0 3px 10px rgba(0,0,0,.3);
    z-index: 25; line-height: 1;
  }

  /* Modal */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: flex;
    align-items: flex-end; justify-content: center; }
  .modal { background: #fff; width: 100%; max-width: 480px; border-radius: 16px 16px 0 0;
    padding: 18px 16px; max-height: 88vh; overflow-y: auto; }
  .modal h2 { margin: 0 0 14px; font-size: 17px; }
  .modal label { display: block; font-size: 12px; color: #777; margin: 12px 0 5px; font-weight: 600; }
  .modal select, .modal input[type=text], .modal input[type=number] {
    width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid #ddd; font-size: 15px;
    background: #fafafa;
  }
  .type-tabs { display: flex; gap: 8px; }
  .type-tabs button { flex: 1; padding: 12px 0; border-radius: 10px; border: 2px solid #ddd;
    background: #fff; font-size: 14px; font-weight: 600; color: #666; }
  .type-tabs button.sel-giris { border-color: #2e7d32; background: #e8f5e9; color: #2e7d32; }
  .type-tabs button.sel-cikis { border-color: #c62828; background: #fdecea; color: #c62828; }
  .type-tabs button.sel-transfer { border-color: #1565c0; background: #e3f2fd; color: #1565c0; }

  .autocomplete-list { border: 1px solid #ddd; border-top: none; border-radius: 0 0 10px 10px;
    max-height: 220px; overflow-y: auto; background: #fff; }
  .autocomplete-list div { padding: 10px 12px; font-size: 14px; border-top: 1px solid #f0f0f0; }
  .autocomplete-list div .ac-code { font-size: 11px; color: #999; }

  .save-btn { width: 100%; padding: 14px; border-radius: 10px; border: none; background: #1f3864;
    color: #fff; font-size: 16px; font-weight: 700; margin-top: 18px; }
  .cancel-btn { width: 100%; padding: 12px; border-radius: 10px; border: none; background: none;
    color: #999; font-size: 14px; margin-top: 8px; }
  .err { color: #c62828; font-size: 12px; margin-top: 6px; display: none; }

  /* History */
  .tx-row { background: #fff; border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; }
  .tx-row .tx-top { display: flex; justify-content: space-between; align-items: center; }
  .tx-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
  .tx-giris { background: #e8f5e9; color: #2e7d32; }
  .tx-cikis { background: #fdecea; color: #c62828; }
  .tx-transfer { background: #e3f2fd; color: #1565c0; }
  .tx-name { font-size: 14px; font-weight: 500; margin-top: 4px; }
  .tx-meta { font-size: 11px; color: #999; margin-top: 2px; }
  .empty-state { text-align: center; color: #999; padding: 40px 20px; font-size: 14px; }
</style>

const DEFAULT_DEPOTS = {
  ana: "Ana Depo",
  yan1: "Yan Depo 1",
  yan2: "Yan Depo 2"
};

let depots = {...DEFAULT_DEPOTS};
let stock = { ana: {}, yan1: {}, yan2: {} };
let transactions = [];
let currentTab = 'depolar';
let openDepotDetail = null; // depot id when viewing detail
let depotSearchQuery = '';

const app = document.getElementById('app');

function fmtNum(n) {
  n = Number(n) || 0;
  return n % 1 === 0 ? n.toString() : n.toFixed(2);
}

function renderDepotList() {
  let html = '<div class="depot-grid">';
  for (const id of Object.keys(depots)) {
    const items = stock[id] || {};
    const codes = Object.keys(items).filter(k => items[k] > 0);
    const totalUnits = codes.reduce((s,k) => s + (items[k]||0), 0);
    html += `<div class="depot-card" onclick="openDepot('${id}')">
      <div class="name" onclick="event.stopPropagation()">
        <input value="${depots[id]}" onchange="renameDepot('${id}', this.value)">
      </div>
      <div class="stats">
        <div class="num">${codes.length}</div>
        <div class="lbl">${codes.length===1?'ürün çeşidi':'ürün çeşidi'} · ${fmtNum(totalUnits)} adet</div>
      </div>
    </div>`;
  }
  html += '</div>';
  app.innerHTML = html;
}

function openDepot(id) {
  openDepotDetail = id;
  renderDepotDetail();
}

function renameDepot(id, val) {
  val = val.trim() || DEFAULT_DEPOTS[id];
  depots[id] = val;
  db.ref('depots/' + id).set(val);
}

function renderDepotDetail() {
  const id = openDepotDetail;
  const items = stock[id] || {};
  const codes = Object.keys(items).filter(k => items[k] !== 0);

  // group by grup from PRODUCTS
  const prodMap = {};
  PRODUCTS.forEach(p => prodMap[p[0]] = p);

  const grouped = {};
  codes.forEach(k => {
    const p = prodMap[k];
    const grup = p ? p[3] : 'DİĞER';
    if (!grouped[grup]) grouped[grup] = [];
    grouped[grup].push(k);
  });

  let html = `<button onclick="backToList()" style="background:none;border:none;color:#1f3864;font-size:14px;padding:6px 0;margin-bottom:6px;">&larr; Depolar</button>`;
  html += `<div class="section-title">${depots[id]} &middot; Stok Durumu</div>`;
  html += `<input class="search-box" id="depotSearchBox" placeholder="Ürün ara (stokta olmasa da)..." value="${depotSearchQuery}" oninput="depotSearchQuery=this.value; renderDepotDetail(); setTimeout(()=>{const b=document.getElementById('depotSearchBox'); if(b){b.focus(); b.setSelectionRange(b.value.length,b.value.length);}},0);">`;

  if (depotSearchQuery.trim().length >= 2) {
    const q = depotSearchQuery.trim().toLowerCase();
    const matches = PRODUCTS.filter(p => p[1].toLowerCase().includes(q) || p[0].toLowerCase().includes(q)).slice(0, 40);
    if (matches.length === 0) {
      html += `<div class="empty-state">Sonuç bulunamadı.</div>`;
    } else {
      matches.forEach(p => {
        const qty = (items[p[0]] || 0);
        html += `<div class="prod-row" onclick="quickTap('${id}','${p[0]}')">
          <div class="info"><div class="pname">${p[1]}</div><div class="pcode">${p[0]}</div></div>
          <div class="pqty">${fmtNum(qty)}<div class="unit">${p[2]}</div></div>
        </div>`;
      });
    }
    app.innerHTML = html;
    return;
  }

  if (codes.length === 0) {
    html += `<div class="empty-state">Bu depoda henüz stok kaydı yok.<br>Yukarıdan ürün arayıp ekleyebilir ya da sağ alttaki + butonunu kullanabilirsin.</div>`;
  } else {
    Object.keys(grouped).sort().forEach(grup => {
      html += `<div class="group-header">${grup}</div>`;
      grouped[grup].sort((a,b) => {
        const pa = prodMap[a], pb = prodMap[b];
        return (pa?pa[1]:a).localeCompare(pb?pb[1]:b);
      }).forEach(k => {
        const p = prodMap[k];
        const name = p ? p[1] : k;
        const unit = p ? p[2] : '';
        html += `<div class="prod-row" onclick="quickTap('${id}','${k}')">
          <div class="info"><div class="pname">${name}</div><div class="pcode">${k}</div></div>
          <div class="pqty">${fmtNum(items[k])}<div class="unit">${unit}</div></div>
        </div>`;
      });
    });
  }
  app.innerHTML = html;
}

function backToList() {
  openDepotDetail = null;
  depotSearchQuery = '';
  renderDepotList();
}

function renderHistory() {
  let html = `<div class="section-title">İşlem Geçmişi</div>`;
  if (transactions.length === 0) {
    html += `<div class="empty-state">Henüz işlem kaydı yok.</div>`;
  } else {
    const sorted = [...transactions].sort((a,b) => b.ts - a.ts);
    sorted.slice(0, 100).forEach(tx => {
      const d = new Date(tx.ts);
      const dateStr = d.toLocaleDateString('tr-TR') + ' ' + d.toLocaleTimeString('tr-TR', {hour:'2-digit',minute:'2-digit'});
      let badge, desc;
      if (tx.type === 'giris') {
        badge = `<span class="tx-badge tx-giris">GİRİŞ</span>`;
        desc = `${depots[tx.depotId] || tx.depotId}`;
      } else if (tx.type === 'cikis') {
        badge = `<span class="tx-badge tx-cikis">ÇIKIŞ</span>`;
        desc = `${depots[tx.depotId] || tx.depotId}`;
      } else {
        badge = `<span class="tx-badge tx-transfer">TRANSFER</span>`;
        desc = `${depots[tx.fromDepot] || tx.fromDepot} &rarr; ${depots[tx.toDepot] || tx.toDepot}`;
      }
      const pending = tx.localId && getQueue().some(q => q.localId === tx.localId);
      html += `<div class="tx-row">
        <div class="tx-top">${badge}<span style="font-size:13px;font-weight:700;">${fmtNum(tx.miktar)} ${tx.birim||''}</span></div>
        <div class="tx-name">${tx.ad}</div>
        <div class="tx-meta">${desc} &middot; ${dateStr}${tx.note ? ' &middot; '+tx.note : ''}${pending ? ' &middot; <span style=\'color:#c62828;font-weight:600;\'>gönderiliyor...</span>' : ''}</div>
      </div>`;
    });
  }
  app.innerHTML = html;
}

function render() {
  if (currentTab === 'depolar') {
    if (openDepotDetail) renderDepotDetail();
    else renderDepotList();
  } else if (currentTab === 'gecmis') {
    renderHistory();
  }
}

// Nav
document.querySelectorAll('nav.bottom button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.bottom button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    openDepotDetail = null;
    render();
  });
});

// ===== Yerel önbellek (internet olmadan da açılabilsin) =====
function loadCache() {
  try {
    const d = localStorage.getItem('cache_depots');
    const s = localStorage.getItem('cache_stock');
    const t = localStorage.getItem('cache_tx');
    if (d) depots = {...DEFAULT_DEPOTS, ...JSON.parse(d)};
    if (s) stock = JSON.parse(s);
    if (t) transactions = JSON.parse(t);
  } catch(e) {}
}
function saveCache() {
  try {
    localStorage.setItem('cache_depots', JSON.stringify(depots));
    localStorage.setItem('cache_stock', JSON.stringify(stock));
    localStorage.setItem('cache_tx', JSON.stringify(transactions.slice(0,300)));
  } catch(e) {}
}
loadCache();
render();

// ===== Bekleyen işlem kuyruğu (internet yokken kaydedilenler) =====
function getQueue() {
  try { return JSON.parse(localStorage.getItem('pending_queue') || '[]'); } catch(e) { return []; }
}
function setQueue(q) { localStorage.setItem('pending_queue', JSON.stringify(q)); }

function updateOfflineBar() {
  const bar = document.getElementById('offlineBar');
  const q = getQueue();
  const isOnline = navigator.onLine;
  if (!isOnline) {
    bar.style.display = 'block';
    bar.textContent = q.length > 0
      ? `İnternet yok — ${q.length} işlem bekliyor, bağlantı gelince otomatik gönderilecek`
      : 'İnternet yok — işlemler cihazda kaydediliyor';
  } else if (q.length > 0) {
    bar.style.display = 'block';
    bar.style.background = '#1565c0';
    bar.textContent = `${q.length} işlem senkronize ediliyor...`;
  } else {
    bar.style.display = 'none';
    bar.style.background = '#c62828';
  }
}

function applyDeltaLocal(depotId, kod, delta) {
  if (!stock[depotId]) stock[depotId] = {};
  stock[depotId][kod] = round2((stock[depotId][kod] || 0) + delta);
}

function trySyncQueue() {
  if (!navigator.onLine) { updateOfflineBar(); return; }
  const q = getQueue();
  if (q.length === 0) { updateOfflineBar(); return; }
  updateOfflineBar();

  const next = q[0];
  const applyOne = (depotId, kod, delta) =>
    db.ref(`stock/${depotId}/${kod}`).transaction(cur => round2((cur || 0) + delta));

  const finishItem = () => {
    const remaining = getQueue().slice(1);
    setQueue(remaining);
    updateOfflineBar();
    if (remaining.length > 0) setTimeout(trySyncQueue, 200);
  };

  const pushTxRecord = () => {
    const rec = {...next};
    delete rec.localId;
    db.ref('transactions').push(rec).then(finishItem).catch(() => setTimeout(trySyncQueue, 5000));
  };

  if (next.type === 'transfer') {
    Promise.all([
      applyOne(next.fromDepot, next.kod, -next.miktar),
      applyOne(next.toDepot, next.kod, next.miktar)
    ]).then(pushTxRecord).catch(() => setTimeout(trySyncQueue, 5000));
  } else {
    const delta = next.type === 'giris' ? next.miktar : -next.miktar;
    applyOne(next.depotId, next.kod, delta).then(pushTxRecord).catch(() => setTimeout(trySyncQueue, 5000));
  }
}

window.addEventListener('online', trySyncQueue);
window.addEventListener('offline', updateOfflineBar);
setInterval(trySyncQueue, 15000);
updateOfflineBar();

// Firebase listeners (bağlantı varsa canlı veriyle günceller)
db.ref('depots').on('value', snap => {
  const val = snap.val();
  if (val) depots = {...DEFAULT_DEPOTS, ...val};
  saveCache();
  render();
});

db.ref('stock').on('value', snap => {
  const val = snap.val() || {};
  stock = { ana: val.ana||{}, yan1: val.yan1||{}, yan2: val.yan2||{} };
  saveCache();
  render();
});

db.ref('transactions').limitToLast(300).on('value', snap => {
  const val = snap.val() || {};
  transactions = Object.keys(val).map(k => ({ id: k, ...val[k] }));
  saveCache();
  render();
});

// ===== Modal: yeni işlem =====
let txType = 'giris';
let selectedProduct = null;
let quickDepotContext = null; // ürün satırından tıklanınca hangi depo bağlamında açıldığı

document.getElementById('fabBtn').addEventListener('click', () => { quickDepotContext = null; openModal(); });

function openModal() {
  txType = 'giris';
  selectedProduct = null;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'modalOverlay';
  overlay.innerHTML = `
    <div class="modal">
      <h2>Yeni İşlem</h2>
      <div class="type-tabs">
        <button id="typeGiris" class="sel-giris" onclick="setType('giris')">Giriş</button>
        <button id="typeCikis" onclick="setType('cikis')">Çıkış</button>
        <button id="typeTransfer" onclick="setType('transfer')">Transfer</button>
      </div>

      <div id="depotFields"></div>

      <label>Ürün</label>
      <input type="text" id="prodSearch" placeholder="Ürün adı veya kod ara..." autocomplete="off" oninput="searchProduct(this.value)">
      <div class="autocomplete-list" id="acList"></div>
      <div id="selectedProdBox"></div>

      <label>Miktar</label>
      <input type="number" id="miktarInput" placeholder="Örn: 12" min="0" step="0.01">

      <label>Not (opsiyonel)</label>
      <input type="text" id="noteInput" placeholder="Örn: tedarikçi adı, sebep...">

      <div class="err" id="modalErr"></div>

      <button class="save-btn" onclick="saveTransaction()">Kaydet</button>
      <button class="cancel-btn" onclick="closeModal()">Vazgeç</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  renderDepotFields();
}

function quickTap(depotId, kod) {
  const p = PRODUCTS.find(x => x[0] === kod);
  if (!p) return;
  txType = 'giris';
  selectedProduct = p;
  quickDepotContext = depotId;
  const currentQty = (stock[depotId] && stock[depotId][kod]) || 0;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.id = 'modalOverlay';
  overlay.innerHTML = `
    <div class="modal">
      <h2>${p[1]}</h2>
      <div style="font-size:12px;color:#999;margin:-8px 0 14px;">${p[0]} &middot; ${depots[depotId]} içinde şu an: <b>${fmtNum(currentQty)} ${p[2]}</b></div>
      <div class="type-tabs">
        <button id="typeGiris" class="sel-giris" onclick="setType('giris')">Giriş</button>
        <button id="typeCikis" onclick="setType('cikis')">Çıkış</button>
        <button id="typeTransfer" onclick="setType('transfer')">Transfer</button>
      </div>

      <div id="depotFields"></div>

      <label>Miktar</label>
      <input type="number" id="miktarInput" placeholder="Örn: 12" min="0" step="0.01">

      <label>Not (opsiyonel)</label>
      <input type="text" id="noteInput" placeholder="Örn: tedarikçi adı, sebep...">

      <div class="err" id="modalErr"></div>

      <button class="save-btn" onclick="saveTransaction()">Kaydet</button>
      <button class="cancel-btn" onclick="closeModal()">Vazgeç</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  renderDepotFields();
  applyQuickDepotPreset(depotId);
  setTimeout(() => { const m = document.getElementById('miktarInput'); if (m) m.focus(); }, 60);
}

function applyQuickDepotPreset(depotId) {
  if (txType === 'transfer') {
    const from = document.getElementById('fromDepot');
    const to = document.getElementById('toDepot');
    if (from) from.value = depotId;
    if (to) {
      const other = Object.keys(depots).find(x => x !== depotId) || depotId;
      to.value = depotId === 'ana' ? other : 'ana';
    }
  } else {
    const single = document.getElementById('singleDepot');
    if (single) single.value = depotId;
  }
}

function closeModal() {
  const o = document.getElementById('modalOverlay');
  if (o) o.remove();
  quickDepotContext = null;
}

function setType(t) {
  txType = t;
  ['typeGiris','typeCikis','typeTransfer'].forEach(id => document.getElementById(id).className = '');
  document.getElementById('typeGiris').className = t==='giris' ? 'sel-giris' : '';
  document.getElementById('typeCikis').className = t==='cikis' ? 'sel-cikis' : '';
  document.getElementById('typeTransfer').className = t==='transfer' ? 'sel-transfer' : '';
  renderDepotFields();
  if (quickDepotContext) applyQuickDepotPreset(quickDepotContext);
}

function renderDepotFields() {
  const box = document.getElementById('depotFields');
  const opts = Object.keys(depots).map(id => `<option value="${id}">${depots[id]}</option>`).join('');
  if (txType === 'transfer') {
    box.innerHTML = `
      <label>Nereden</label>
      <select id="fromDepot">${opts}</select>
      <label>Nereye</label>
      <select id="toDepot">${opts}</select>
    `;
    // default: yan -> ana
    setTimeout(() => {
      const to = document.getElementById('toDepot');
      if (to) to.value = 'ana';
      const from = document.getElementById('fromDepot');
      if (from) from.value = 'yan1';
    }, 0);
  } else {
    box.innerHTML = `
      <label>Depo</label>
      <select id="singleDepot">${opts}</select>
    `;
  }
}

function searchProduct(q) {
  const acList = document.getElementById('acList');
  q = q.trim().toLowerCase();
  if (q.length < 2) { acList.innerHTML = ''; return; }
  const matches = PRODUCTS.filter(p =>
    p[1].toLowerCase().includes(q) || p[0].toLowerCase().includes(q)
  ).slice(0, 20);
  acList.innerHTML = matches.map(p =>
    `<div onclick='pickProduct("${p[0]}")'>${p[1]} <div class="ac-code">${p[0]} · ${p[2]}</div></div>`
  ).join('');
}

function pickProduct(kod) {
  const p = PRODUCTS.find(x => x[0] === kod);
  selectedProduct = p;
  document.getElementById('acList').innerHTML = '';
  document.getElementById('prodSearch').value = '';
  document.getElementById('selectedProdBox').innerHTML =
    `<div style="background:#eef2fb;border-radius:8px;padding:8px 10px;margin-top:6px;font-size:13px;">
      Seçilen: <b>${p[1]}</b> (${p[0]}, ${p[2]})
      <span onclick="clearProduct()" style="float:right;color:#c62828;cursor:pointer;">&times;</span>
    </div>`;
}

function clearProduct() {
  selectedProduct = null;
  document.getElementById('selectedProdBox').innerHTML = '';
}

function saveTransaction() {
  const errBox = document.getElementById('modalErr');
  errBox.style.display = 'none';

  if (!selectedProduct) {
    errBox.textContent = 'Lütfen bir ürün seç.';
    errBox.style.display = 'block';
    return;
  }
  const miktar = parseFloat(document.getElementById('miktarInput').value);
  if (!miktar || miktar <= 0) {
    errBox.textContent = 'Geçerli bir miktar gir.';
    errBox.style.display = 'block';
    return;
  }

  const note = document.getElementById('noteInput').value.trim();
  const [kod, ad, birim] = selectedProduct;
  const now = Date.now();
  const localId = 'local_' + now + '_' + Math.random().toString(36).slice(2,8);

  let txRecord;
  if (txType === 'transfer') {
    const from = document.getElementById('fromDepot').value;
    const to = document.getElementById('toDepot').value;
    if (from === to) {
      errBox.textContent = 'Kaynak ve hedef depo aynı olamaz.';
      errBox.style.display = 'block';
      return;
    }
    txRecord = { type: 'transfer', fromDepot: from, toDepot: to, kod, ad, birim, miktar, note, ts: now, localId };
    applyDeltaLocal(from, kod, -miktar);
    applyDeltaLocal(to, kod, miktar);
  } else {
    const depotId = document.getElementById('singleDepot').value;
    txRecord = { type: txType, depotId, kod, ad, birim, miktar, note, ts: now, localId };
    const delta = txType === 'giris' ? miktar : -miktar;
    applyDeltaLocal(depotId, kod, delta);
  }

  // Anında ekranda göster (internet olmasa bile)
  transactions.unshift(txRecord);
  saveCache();

  // Kuyruğa ekle ve senkronizasyonu dene
  const q = getQueue();
  q.push(txRecord);
  setQueue(q);
  updateOfflineBar();
  trySyncQueue();

  closeModal();
  render();
}

function round2(n) { return Math.round(n * 100) / 100; }

render();
</script>
