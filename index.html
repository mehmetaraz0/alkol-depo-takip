<style>

  }
  .depot-card .name { font-size: 16px; font-weight: 600; }
  .depot-card .name input {

  .depot-card .stats { text-align: right; }

  .prod-row { background: #fff; border-radius: 10px; padding: 10px 12px; margin-bottom: 6px;

  .prod-row:active { background: #eef2fb; }
  .prod-row .info { flex: 1; min-width: 0; }
  .prod-row .pname { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis;

  nav.bottom button.active { color: #1f3864; font-weight: 700; }
  nav.bottom .icon { font-size: 20px; }

  /* FAB */

    position: fixed; bottom: 76px; right: 16px; width: 56px; height: 56px; border-radius: 50%;
    background: #C00000; color: #fff; border: none; font-size: 28px; box-shadow: 0 3px 10px rgba(0,0,0,.3);
    z-index: 25; line-height: 1;

  /* Modal */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; display: flex;

  .modal { background: #fff; width: 100%; max-width: 480px; border-radius: 16px 16px 0 0;

  .modal label { display: block; font-size: 12px; color: #777; margin: 12px 0 5px; font-weight: 600; }
  .modal select, .modal input[type=text], .modal input[type=number] {

  .type-tabs button.sel-transfer { border-color: #1565c0; background: #e3f2fd; color: #1565c0; }

  .autocomplete-list { border: 1px solid #ddd; border-top: none; border-radius: 0 0 10px 10px;

  /* History */

  .tx-row .tx-top { display: flex; justify-content: space-between; align-items: center; }

  .filtre-satiri { display: flex; gap: 8px; margin-bottom: 10px; }

  .report-actions { display: flex; gap: 8px; margin-bottom: 10px; }
  .report-actions button { flex: 1; padding: 10px; border-radius: 10px; border: 1px solid #ddd;

  table.report-table th:first-child, table.report-table td:first-child { text-align: left; position: sticky; left: 0; background: #fff; }
  table.report-table thead th { background: #1f3864; color: #fff; position: sticky; top: 0; }
  table.report-table tr.grp td { background: #e8e8ee; font-weight: 700; text-align: left; color: #444; }
  table.report-table td.tot { font-weight: 700; color: #1f3864; }

  @media print {
    header, nav.bottom, .fab, .report-actions, .search-box { display: none !important; }

    table.report-table thead th { position: static; }

  #guncellemeBari {

  /* Ayarlar */
  .ayar-blok { background: #fff; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .ayar-blok h3 { margin: 0 0 10px; font-size: 14px; font-weight: 700; color: #1f3864; }

  .ayar-satir:last-child { border-bottom: none; }
  .ayar-btn { background: #1f3864; color: #fff; border: none; border-radius: 8px;
    padding: 9px 14px; font-size: 13px; font-weight: 600; }
  .ayar-btn.tehlike { background: none; color: #c62828; border: 1px solid #f0c0c0; }
  .ayar-not { font-size: 12px; color: #888; line-height: 1.5; margin-top: 8px; }

  /* PIN ekrani */
  #pinEkrani {
    position: fixed; inset: 0; background: #1f3864; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; color: #fff;

  #pinEkrani .alt { font-size: 13px; opacity: .7; margin-bottom: 26px; }
  #pinEkrani input {

    background: #fff; color: #1f3864; font-size: 15px; font-weight: 700;

</style>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA3T0cLeSZK70In_RWcqkq3QEk8nzvBAJA",
  authDomain: "alkol-depo-takip.firebaseapp.com",
  databaseURL: "https://alkol-depo-takip-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "alkol-depo-takip",
  storageBucket: "alkol-depo-takip.firebasestorage.app",
  messagingSenderId: "861371573670",
  appId: "1:861371573670:web:d383c354807a76fc839b67"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ===== PIN dogrulama =====
async function sha256(metin) {
  const tampon = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(metin));
  return [...new Uint8Array(tampon)].map(b => b.toString(16).padStart(2, '0')).join('');
}

const PIN_HATIRLA_GUN = 30;
let pinOzeti = localStorage.getItem('cache_pin_hash') || null;

db.ref('settings/pinHash').on('value', snap => {
  const deger = snap.val();
  if (deger) {
    pinOzeti = deger;
    localStorage.setItem('cache_pin_hash', deger);   // cevrimdisi dogrulama icin sart
  }
});

function cihazDogrulanmisMi() {
  const zaman = Number(localStorage.getItem('pin_dogrulandi') || 0);
  return zaman > 0 && (Date.now() - zaman) < PIN_HATIRLA_GUN * 86400000;
}

function pinEkraniniGoster(kip) {
  const kurulum = kip === 'kurulum';
  const ekran = document.createElement('div');
  ekran.id = 'pinEkrani';
  ekran.innerHTML = `
    <h2>${kurulum ? 'PIN Belirle' : 'Alkol Depo Takip'}</h2>
    <div class="alt">${kurulum ? '4 haneli bir kod seç' : 'Devam etmek için PIN gir'}</div>
    <input id="pinGirdi" type="password" inputmode="numeric" maxlength="4"
           autocomplete="off" enterkeyhint="done" placeholder="····">
    <div class="pin-hata" id="pinHata"></div>
    <button id="pinOnayBtn">${kurulum ? 'Kaydet' : 'Gir'}</button>
  `;
  document.body.appendChild(ekran);

  const girdi = document.getElementById('pinGirdi');
  const hata = document.getElementById('pinHata');
  girdi.focus();

  async function onayla() {
    const kod = girdi.value.trim();
    if (!/^\d{4}$/.test(kod)) { hata.textContent = 'PIN 4 rakam olmalı.'; return; }
    const ozet = await sha256(kod);

    if (kurulum) {
      await db.ref('settings/pinHash').set(ozet);
      pinOzeti = ozet;
      localStorage.setItem('cache_pin_hash', ozet);
    } else if (ozet !== pinOzeti) {
      hata.textContent = 'PIN hatalı.';
      girdi.value = '';
      girdi.focus();
      return;
    }

    localStorage.setItem('pin_dogrulandi', String(Date.now()));
    ekran.remove();
    bekleyenRenderiBosalt();
  }

  document.getElementById('pinOnayBtn').addEventListener('click', onayla);
  girdi.addEventListener('keydown', e => { if (e.key === 'Enter') onayla(); });
}

async function pinDegistir() {
  if (pinOzeti) {
    const eski = (prompt('Mevcut PIN:') || '').trim();
    if (!eski) return;
    if (await sha256(eski) !== pinOzeti) { alert('Mevcut PIN hatalı.'); return; }
  }
  const yeni = (prompt('Yeni PIN (4 rakam):') || '').trim();
  if (!/^\d{4}$/.test(yeni)) { alert('PIN 4 rakam olmalı.'); return; }
  const ozet = await sha256(yeni);
  await db.ref('settings/pinHash').set(ozet);
  pinOzeti = ozet;
  localStorage.setItem('cache_pin_hash', ozet);
  localStorage.setItem('pin_dogrulandi', String(Date.now()));
  alert('PIN güncellendi.');
}

const DEFAULT_DEPOTS = {
  ana: "Ana Depo",
  yan1: "Yan Depo 1",
  yan2: "Yan Depo 2"
};

let depots = {...DEFAULT_DEPOTS};
let stock = { ana: {}, yan1: {}, yan2: {} };
let transactions = [];
let currentTab = 'depolar';
let openDepotDetail = null; // depot id when viewing detail
let depotSearchQuery = '';
let customProducts = {};

const SURUM = 'v11';   // sw.js icindeki CACHE_ADI ile ayni tutulur

const app = document.getElementById('app');

function fmtNum(n) {
  n = Number(n) || 0;
  return n % 1 === 0 ? n.toString() : n.toFixed(2);
}

function escapeHtml(deger) {
  return String(deger == null ? '' : deger)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function prodMap() {
  const m = {};
  PRODUCTS.forEach(p => m[p[0]] = p);
  Object.keys(customProducts).forEach(kod => {
    const c = customProducts[kod];
    if (!c || typeof c.ad !== 'string' || typeof c.birim !== 'string' || typeof c.grup !== 'string') return;
    m[kod] = [kod, c.ad, c.birim, c.grup];
  });
  return m;
}

function renderDepotList() {
  let html = '<div class="depot-grid">';
  for (const id of Object.keys(depots)) {
    const items = stock[id] || {};
    const codes = Object.keys(items).filter(k => items[k] > 0);
    const totalUnits = codes.reduce((s,k) => s + (items[k]||0), 0);
    html += `<div class="depot-card" onclick="openDepot('${escapeHtml(id)}')">
      <div class="name" onclick="event.stopPropagation()">
        <input value="${escapeHtml(depots[id])}" onchange="renameDepot('${escapeHtml(id)}', this.value)">
      </div>
      <div class="stats">
        <div class="num">${codes.length}</div>
        <div class="lbl">${codes.length===1?'ürün çeşidi':'ürün çeşidi'} · ${fmtNum(totalUnits)} adet</div>
      </div>
    </div>`;
  }
  html += '</div>';
  app.innerHTML = html;
}

function openDepot(id) {
  openDepotDetail = id;
  renderDepotDetail();
  history.pushState({ depotAcik: true }, '');
}

function renameDepot(id, val) {
  val = val.trim() || DEFAULT_DEPOTS[id] || depots[id];
  depots[id] = val;
  db.ref('depots/' + id).set(val);
}

function renderDepotDetail() {
  const id = openDepotDetail;
  app.innerHTML =
    `<button onclick="backToList()" style="background:none;border:none;color:#1f3864;font-size:14px;padding:6px 0;margin-bottom:6px;">&larr; Depolar</button>` +
    `<div class="section-title">${escapeHtml(depots[id])} &middot; Stok Durumu</div>` +
    `<input class="search-box" id="depotSearchBox" placeholder="Ürün ara (stokta olmasa da)..." value="${escapeHtml(depotSearchQuery)}">` +
    `<div id="depotBody"></div>`;

  const kutu = document.getElementById('depotSearchBox');
  kutu.addEventListener('input', () => {
    depotSearchQuery = kutu.value;
    renderDepotBody();
  });
  renderDepotBody();
}

function renderDepotBody() {
  const id = openDepotDetail;
  const govde = document.getElementById('depotBody');
  if (!govde) return;
  const items = stock[id] || {};
  const pm = prodMap();
  let html = '';

  if (depotSearchQuery.trim().length >= 2) {
    const q = depotSearchQuery.trim().toLowerCase();
    const eslesenler = Object.values(pm)
      .filter(p => p[1].toLowerCase().includes(q) || p[0].toLowerCase().includes(q))
      .slice(0, 40);
    if (eslesenler.length === 0) {
      html = `<div class="empty-state">Sonuç bulunamadı.</div>`;
    } else {
      eslesenler.forEach(p => {
        const adet = items[p[0]] || 0;
        html += `<div class="prod-row" onclick="quickTap('${escapeHtml(id)}','${escapeHtml(p[0])}')">
          <div class="info"><div class="pname">${escapeHtml(p[1])}</div><div class="pcode">${escapeHtml(p[0])}</div></div>
          <div class="pqty">${fmtNum(adet)}<div class="unit">${escapeHtml(p[2])}</div></div>
        </div>`;
      });
    }
    govde.innerHTML = html;
    return;
  }

  const kodlar = Object.keys(items).filter(k => items[k] !== 0);
  if (kodlar.length === 0) {
    govde.innerHTML = `<div class="empty-state">Bu depoda henüz stok kaydı yok.<br>Yukarıdan ürün arayıp ekleyebilir ya da sağ alttaki + butonunu kullanabilirsin.</div>`;
    return;
  }

  const gruplu = {};
  kodlar.forEach(k => {
    const grup = pm[k] ? pm[k][3] : 'DİĞER';
    (gruplu[grup] = gruplu[grup] || []).push(k);
  });

  Object.keys(gruplu).sort().forEach(grup => {
    html += `<div class="group-header">${escapeHtml(grup)}</div>`;
    gruplu[grup]
      .sort((a, b) => (pm[a] ? pm[a][1] : a).localeCompare(pm[b] ? pm[b][1] : b))
      .forEach(k => {
        const ad = pm[k] ? pm[k][1] : k;
        const birim = pm[k] ? pm[k][2] : '';
        html += `<div class="prod-row" onclick="quickTap('${escapeHtml(id)}','${escapeHtml(k)}')">
          <div class="info"><div class="pname">${escapeHtml(ad)}</div><div class="pcode">${escapeHtml(k)}</div></div>
          <div class="pqty">${fmtNum(items[k])}<div class="unit">${escapeHtml(birim)}</div></div>
        </div>`;
      });
  });
  govde.innerHTML = html;
}

function depotListesineDon() {
  openDepotDetail = null;
  depotSearchQuery = '';
  renderDepotList();
}

function backToList() {
  if (history.state && history.state.depotAcik) {
    history.back();   // popstate tetiklenir, depotListesineDon cagirilir
  } else {
    depotListesineDon();
  }
}

let reportSearchQuery = '';

function renderReport() {
  app.innerHTML =
    `<div class="section-title">Stok Raporu &middot; Tüm Depolar</div>` +
    `<div class="report-actions">
      <button onclick="window.print()">Yazdır</button>
      <button onclick="exportReportCsv()">Excel'e Aktar</button>
    </div>` +
    `<input class="search-box" id="reportSearchBox" placeholder="Ürün ara..." value="${escapeHtml(reportSearchQuery)}">` +
    `<div id="reportBody"></div>`;

  const kutu = document.getElementById('reportSearchBox');
  kutu.addEventListener('input', () => {
    reportSearchQuery = kutu.value;
    renderReportBody();
  });
  renderReportBody();
}

function renderReportBody() {
  const govde = document.getElementById('reportBody');
  if (!govde) return;
  const pm = prodMap();
  const depotIds = Object.keys(depots);

  // hangi ürün kodları herhangi bir depoda stoklu
  const allCodes = new Set();
  depotIds.forEach(id => Object.keys(stock[id] || {}).forEach(k => {
    if ((stock[id][k] || 0) !== 0) allCodes.add(k);
  }));

  let codes = [...allCodes];
  const q = reportSearchQuery.trim().toLowerCase();
  if (q) {
    codes = codes.filter(k => {
      const p = pm[k];
      return (p ? p[1].toLowerCase() : k.toLowerCase()).includes(q) || k.toLowerCase().includes(q);
    });
  }

  const grouped = {};
  codes.forEach(k => {
    const p = pm[k];
    const grup = p ? p[3] : 'DİĞER';
    if (!grouped[grup]) grouped[grup] = [];
    grouped[grup].push(k);
  });

  let html = '';
  if (codes.length === 0) {
    html = `<div class="empty-state">Gösterilecek stok kaydı yok.</div>`;
  } else {
    html = `<div class="report-table-wrap"><table class="report-table"><thead><tr>
      <th>Ürün</th>${depotIds.map(id => `<th>${escapeHtml(depots[id])}</th>`).join('')}<th>Toplam</th>
    </tr></thead><tbody>`;
    Object.keys(grouped).sort().forEach(grup => {
      html += `<tr class="grp"><td colspan="${depotIds.length + 2}">${escapeHtml(grup)}</td></tr>`;
      grouped[grup].sort((a,b) => {
        const pa = pm[a], pb = pm[b];
        return (pa?pa[1]:a).localeCompare(pb?pb[1]:b);
      }).forEach(k => {
        const p = pm[k];
        const name = p ? p[1] : k;
        const unit = p ? p[2] : '';
        let total = 0;
        const cells = depotIds.map(id => {
          const v = (stock[id] && stock[id][k]) || 0;
          total += v;
          return `<td>${v ? fmtNum(v) : '-'}</td>`;
        }).join('');
        html += `<tr><td>${escapeHtml(name)} <span style="color:#999;font-weight:400;">(${escapeHtml(unit)})</span></td>${cells}<td class="tot">${fmtNum(total)}</td></tr>`;
      });
    });
    html += `</tbody></table></div>`;
  }
  govde.innerHTML = html;
}

function exportReportCsv() {
  const pm = prodMap();
  const depotIds = Object.keys(depots);

  const allCodes = new Set();
  depotIds.forEach(id => Object.keys(stock[id] || {}).forEach(k => {
    if ((stock[id][k] || 0) !== 0) allCodes.add(k);
  }));
  const codes = [...allCodes].sort((a,b) => {
    const pa = pm[a], pb = pm[b];
    return (pa?pa[1]:a).localeCompare(pb?pb[1]:b);
  });

  const headers = ['Kod','Ürün Adı','Birim','Grup', ...depotIds.map(id => depots[id]), 'Toplam'];
  const rows = [headers];
  codes.forEach(k => {
    const p = pm[k];
    const name = p ? p[1] : k;
    const unit = p ? p[2] : '';
    const grup = p ? p[3] : '';
    let total = 0;
    const vals = depotIds.map(id => {
      const v = (stock[id] && stock[id][k]) || 0;
      total += v;
      return fmtNum(v);
    });
    rows.push([k, name, unit, grup, ...vals, fmtNum(total)]);
  });

  const csv = rows.map(r => r.map(cell => {
    const s = String(cell).replace(/"/g, '""');
    return /[",;\n]/.test(s) ? `"${s}"` : s;
  }).join(';')).join('\r\n');

  const dateStr = new Date().toISOString().slice(0,10);
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Stok_Raporu_${dateStr}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function gecmisiSuz() {
  const simdi = Date.now();
  const sinir = gecmisAralik === 'tumu' ? 0 : simdi - Number(gecmisAralik) * 86400000;

  return transactions.filter(tx => {
    if (tx.ts < sinir) return false;
    if (gecmisTur !== 'tumu' && tx.type !== gecmisTur) return false;
    if (gecmisDepo !== 'tumu') {
      const ilgili = tx.type === 'transfer'
        ? (tx.fromDepot === gecmisDepo || tx.toDepot === gecmisDepo)
        : tx.depotId === gecmisDepo;
      if (!ilgili) return false;
    }
    return true;
  }).sort((a, b) => b.ts - a.ts);
}

function renderHistoryBody() {
  const govde = document.getElementById('historyBody');
  if (!govde) return;
  const kayitlar = gecmisiSuz();

  if (kayitlar.length === 0) {
    govde.innerHTML = `<div class="empty-state">${
      transactions.length === 0 ? 'Henüz işlem kaydı yok.' : 'Bu filtrelere uyan işlem yok.'
    }</div>`;
    return;
  }

  let html = '';
  kayitlar.slice(0, 100).forEach(tx => {
    const d = new Date(tx.ts);
    const dateStr = d.toLocaleDateString('tr-TR') + ' ' + d.toLocaleTimeString('tr-TR', {hour:'2-digit',minute:'2-digit'});
    let badge, desc;
    if (tx.type === 'giris') {
      badge = `<span class="tx-badge tx-giris">GİRİŞ</span>`;
      desc = `${escapeHtml(depots[tx.depotId] || tx.depotId)}`;
    } else if (tx.type === 'cikis') {
      badge = `<span class="tx-badge tx-cikis">ÇIKIŞ</span>`;
      desc = `${escapeHtml(depots[tx.depotId] || tx.depotId)}`;
    } else {
      badge = `<span class="tx-badge tx-transfer">TRANSFER</span>`;
      desc = `${escapeHtml(depots[tx.fromDepot] || tx.fromDepot)} &rarr; ${escapeHtml(depots[tx.toDepot] || tx.toDepot)}`;
    }
    const pending = tx.localId && getQueue().some(q => q.localId === tx.localId);
    const geriAlmaKaydi = !!tx.revertOf;
    const dugme = (!geriAlmaKaydi && !tx.reverted && tx.id && !pending)
      ? `<button class="tx-undo" onclick="geriAl('${escapeHtml(tx.id)}')">Geri al</button>`
      : '';
    const isaret = tx.reverted ? ' <span class="tx-badge tx-revert-badge">GERİ ALINDI</span>' : '';
    html += `<div class="tx-row${tx.reverted ? ' tx-reverted' : ''}">
      <div class="tx-top">${badge}${isaret}<span style="font-size:13px;font-weight:700;">${fmtNum(tx.miktar)} ${escapeHtml(tx.birim||'')}</span></div>

      ${dugme}
    </div>`;
  });
  govde.innerHTML = html;
}

function depoEkle() {
  const ad = (prompt('Yeni deponun adı:') || '').trim();
  if (!ad) return;
  if (Object.values(depots).some(d => d.toLowerCase() === ad.toLowerCase())) {
    alert('Bu adda bir depo zaten var.');
    return;
  }
  const id = 'depo_' + Date.now();
  depots[id] = ad;
  if (!stock[id]) stock[id] = {};
  db.ref('depots/' + id).set(ad);
  saveCache();
  render();
}

function depoSil(id) {
  if (DEFAULT_DEPOTS[id]) { alert('Varsayılan depolar silinemez.'); return; }
  const dolu = Object.values(stock[id] || {}).some(v => v !== 0);
  if (dolu) { alert('Bu depoda stok var. Önce stoğu boşalt ya da başka depoya aktar.'); return; }
  if (!confirm(`"${depots[id]}" deposu silinsin mi?`)) return;
  delete depots[id];
  delete stock[id];
  db.ref('depots/' + id).remove();
  db.ref('stock/' + id).remove();
  saveCache();
  render();
}

function urunEkle() {
  const kod = (prompt('Ürün kodu (örn: ICB09000001):') || '').trim().toUpperCase();
  if (!kod) return;
  if (!/^[A-Z0-9_-]{3,32}$/.test(kod)) { alert('Ürün kodu yalnızca büyük harf, rakam, - ve _ içerebilir (3-32 karakter).'); return; }
  if (prodMap()[kod]) { alert('Bu kod zaten kayıtlı: ' + prodMap()[kod][1]); return; }

  const ad = (prompt('Ürün adı:') || '').trim();
  if (!ad) return;

  const birim = (prompt('Birim — bot / kol / fic / lt:', 'bot') || '').trim().toLowerCase();
  if (!['bot', 'kol', 'fic', 'lt'].includes(birim)) { alert('Birim bot, kol, fic ya da lt olmalı.'); return; }

  const gruplar = [...new Set(Object.values(prodMap()).map(p => p[3]))].sort();
  const grup = (prompt('Grup:\n\n' + gruplar.join('\n'), gruplar[0]) || '').trim().toUpperCase();
  if (!grup) return;

  db.ref('customProducts/' + kod).set({ ad, birim, grup });
  alert(`"${ad}" eklendi.`);
}

function getQueue() {
  try { return JSON.parse(localStorage.getItem('pending_queue') || '[]'); } catch(e) { return []; }
}
function setQueue(q) { localStorage.setItem('pending_queue', JSON.stringify(q)); }

function updateOfflineBar() {
  const bar = document.getElementById('offlineBar');
  const q = getQueue();
  const isOnline = navigator.onLine;
  if (!isOnline) {
    bar.style.display = 'block';
    bar.textContent = q.length > 0
      ? `İnternet yok — ${q.length} işlem bekliyor, bağlantı gelince otomatik gönderilecek`
      : 'İnternet yok — işlemler cihazda kaydediliyor';
  } else if (q.length > 0) {
    bar.style.display = 'block';
    bar.style.background = '#1565c0';
    bar.textContent = `${q.length} işlem senkronize ediliyor...`;
  } else {
    bar.style.display = 'none';
    bar.style.background = '#c62828';
  }
}

function applyDeltaLocal(depotId, kod, delta) {
  if (!stock[depotId]) stock[depotId] = {};
  stock[depotId][kod] = round2((stock[depotId][kod] || 0) + delta);
}

function trySyncQueue() {
  if (!navigator.onLine) { updateOfflineBar(); return; }
  const q = getQueue();
  if (q.length === 0) { updateOfflineBar(); return; }
  updateOfflineBar();

  const next = q[0];
  const applyOne = (depotId, kod, delta) =>
    db.ref(`stock/${depotId}/${kod}`).transaction(cur => round2((cur || 0) + delta));

  const finishItem = () => {
    const remaining = getQueue().slice(1);
    setQueue(remaining);
    updateOfflineBar();
    if (remaining.length > 0) setTimeout(trySyncQueue, 200);
  };

  const pushTxRecord = () => {
    const rec = {...next};
    delete rec.localId;
    db.ref('transactions').push(rec).then(finishItem).catch(() => setTimeout(trySyncQueue, 5000));
  };

  if (next.type === 'transfer') {
    Promise.all([
      applyOne(next.fromDepot, next.kod, -next.miktar),
      applyOne(next.toDepot, next.kod, next.miktar)
    ]).then(pushTxRecord).catch(() => setTimeout(trySyncQueue, 5000));
  } else {
    const delta = next.type === 'giris' ? next.miktar : -next.miktar;
    applyOne(next.depotId, next.kod, delta).then(pushTxRecord).catch(() => setTimeout(trySyncQueue, 5000));
  }
}

window.addEventListener('online', trySyncQueue);
window.addEventListener('offline', updateOfflineBar);

             inputmode="decimal" enterkeyhint="done">

      <label>Not (opsiyonel)</label>
      <input type="text" id="noteInput" placeholder="Örn: tedarikçi adı, sebep...">

      <div class="err" id="modalErr"></div>

      <button class="save-btn" onclick="saveTransaction()">Kaydet</button>
      <button class="cancel-btn" onclick="closeModal()">Vazgeç</button>
    </div>
  `);
  renderDepotFields();
  applyQuickDepotPreset(depotId);
  setTimeout(() => { const m = document.getElementById('miktarInput'); if (m) m.focus(); }, 60);
}

function applyQuickDepotPreset(depotId) {
  if (txType === 'transfer') {
    const from = document.getElementById('fromDepot');
    const to = document.getElementById('toDepot');
    if (from) from.value = depotId;
    if (to) {
      const other = Object.keys(depots).find(x => x !== depotId) || depotId;
      to.value = depotId === 'ana' ? other : 'ana';
    }
  } else {
    const single = document.getElementById('singleDepot');
    if (single) single.value = depotId;
  }
}

function closeModal() {
  if (history.state && history.state.modalAcik) {
    history.back();   // popstate tetiklenir, overlayKaldir cagirilir
  } else {
    overlayKaldir();
  }
}

function setType(t) {
  txType = t;
  ['typeGiris','typeCikis','typeTransfer'].forEach(id => document.getElementById(id).className = '');
  document.getElementById('typeGiris').className = t==='giris' ? 'sel-giris' : '';
  document.getElementById('typeCikis').className = t==='cikis' ? 'sel-cikis' : '';
  document.getElementById('typeTransfer').className = t==='transfer' ? 'sel-transfer' : '';
  renderDepotFields();
  if (quickDepotContext) applyQuickDepotPreset(quickDepotContext);
}

function renderDepotFields() {
  const box = document.getElementById('depotFields');
  const secenek = (id, secili) =>
    `<option value="${escapeHtml(id)}"${secili ? ' selected' : ''}>${escapeHtml(depots[id])}</option>`;
  const idler = Object.keys(depots);

  if (txType === 'transfer') {
    const varsayilanKaynak = idler.find(x => x !== 'ana') || idler[0];
    box.innerHTML = `
      <label>Nereden</label>
      <select id="fromDepot">${idler.map(id => secenek(id, id === varsayilanKaynak)).join('')}</select>
      <label>Nereye</label>
      <select id="toDepot">${idler.map(id => secenek(id, id === 'ana')).join('')}</select>
    `;
  } else {
    box.innerHTML = `
      <label>Depo</label>
      <select id="singleDepot">${idler.map(id => secenek(id, false)).join('')}</select>
    `;
  }
}

function searchProduct(q) {
  const acList = document.getElementById('acList');
  q = q.trim().toLowerCase();
  if (q.length < 2) { acList.innerHTML = ''; return; }
  const eslesenler = Object.values(prodMap())
    .filter(p => p[1].toLowerCase().includes(q) || p[0].toLowerCase().includes(q))
    .slice(0, 20);
  acList.innerHTML = eslesenler.map(p =>
    `<div onclick='pickProduct("${escapeHtml(p[0])}")'>${escapeHtml(p[1])}<div class="ac-code">${escapeHtml(p[0])} · ${escapeHtml(p[2])}</div></div>`
  ).join('');
}

function pickProduct(kod) {
  const p = prodMap()[kod];
  selectedProduct = p;
  document.getElementById('acList').innerHTML = '';
  document.getElementById('prodSearch').value = '';
  document.getElementById('selectedProdBox').innerHTML =
    `<div style="background:#eef2fb;border-radius:8px;padding:8px 10px;margin-top:6px;font-size:13px;">
      Seçilen: <b>${escapeHtml(p[1])}</b> (${escapeHtml(p[0])}, ${escapeHtml(p[2])})
      <span onclick="clearProduct()" style="float:right;color:#c62828;cursor:pointer;">&times;</span>
    </div>`;
}

function clearProduct() {
  selectedProduct = null;
  document.getElementById('selectedProdBox').innerHTML = '';
}

function stokYeterliMi(depoId, kod, miktar) {
  const mevcut = (stock[depoId] && stock[depoId][kod]) || 0;
  return { yeterli: miktar <= mevcut, mevcut };
}

function stokUyarisiGec(depoId, kod, miktar, birim) {
  const { yeterli, mevcut } = stokYeterliMi(depoId, kod, miktar);
  if (yeterli) return true;
  return confirm(
    `Stok yetersiz.\n\n${depots[depoId] || depoId} içinde şu an ${fmtNum(mevcut)} ${birim} var, ` +
    `${fmtNum(miktar)} ${birim} çıkışı yapılmak isteniyor.\n\nYine de kaydedilsin mi?`
  );
}

function saveTransaction() {
  const errBox = document.getElementById('modalErr');
  errBox.style.display = 'none';

  if (!selectedProduct) {
    errBox.textContent = 'Lütfen bir ürün seç.';
    errBox.style.display = 'block';
    return;
  }
  const miktar = parseFloat(document.getElementById('miktarInput').value);
  if (!miktar || miktar <= 0) {
    errBox.textContent = 'Geçerli bir miktar gir.';
    errBox.style.display = 'block';
    return;
  }

  const note = document.getElementById('noteInput').value.trim();
  const [kod, ad, birim] = selectedProduct;
  const now = Date.now();
  const localId = 'local_' + now + '_' + Math.random().toString(36).slice(2,8);

  let txRecord;
  if (txType === 'transfer') {
    const from = document.getElementById('fromDepot').value;
    const to = document.getElementById('toDepot').value;
    if (from === to) {
      errBox.textContent = 'Kaynak ve hedef depo aynı olamaz.';
      errBox.style.display = 'block';
      return;
    }
    if (!stokUyarisiGec(from, kod, miktar, birim)) return;
    txRecord = { type: 'transfer', fromDepot: from, toDepot: to, kod, ad, birim, miktar, note, ts: now, localId };
    applyDeltaLocal(from, kod, -miktar);
    applyDeltaLocal(to, kod, miktar);
  } else {
    const depotId = document.getElementById('singleDepot').value;
    if (txType === 'cikis' && !stokUyarisiGec(depotId, kod, miktar, birim)) return;
    txRecord = { type: txType, depotId, kod, ad, birim, miktar, note, ts: now, localId };
    const delta = txType === 'giris' ? miktar : -miktar;
    applyDeltaLocal(depotId, kod, delta);
  }

  // Anında ekranda göster (internet olmasa bile)
  transactions.unshift(txRecord);
  saveCache();

  // Kuyruğa ekle ve senkronizasyonu dene
  const q = getQueue();
  q.push(txRecord);
  setQueue(q);
  updateOfflineBar();
  trySyncQueue();

  closeModal();
  render();
}

function geriAl(id) {
  const tx = transactions.find(t => t.id === id);
  if (!tx) return;
  if (tx.reverted) { alert('Bu işlem zaten geri alınmış.'); return; }

  const ozet = tx.type === 'transfer'
    ? `${depots[tx.fromDepot] || tx.fromDepot} → ${depots[tx.toDepot] || tx.toDepot}`
    : (depots[tx.depotId] || tx.depotId);
  if (!confirm(`Geri alınacak:\n\n${tx.ad}\n${fmtNum(tx.miktar)} ${tx.birim || ''} · ${ozet}\n\nOnaylıyor musun?`)) return;

  const simdi = Date.now();
  const localId = 'local_' + simdi + '_' + Math.random().toString(36).slice(2, 8);
  let ters;

  if (tx.type === 'transfer') {
    ters = { type: 'transfer', fromDepot: tx.toDepot, toDepot: tx.fromDepot,
             kod: tx.kod, ad: tx.ad, birim: tx.birim, miktar: tx.miktar,
             note: 'Geri alma', ts: simdi, localId, revertOf: id };
    applyDeltaLocal(tx.toDepot, tx.kod, -tx.miktar);
    applyDeltaLocal(tx.fromDepot, tx.kod, tx.miktar);
  } else {
    const tersTur = tx.type === 'giris' ? 'cikis' : 'giris';
    ters = { type: tersTur, depotId: tx.depotId,
             kod: tx.kod, ad: tx.ad, birim: tx.birim, miktar: tx.miktar,
             note: 'Geri alma', ts: simdi, localId, revertOf: id };
    applyDeltaLocal(tx.depotId, tx.kod, tersTur === 'giris' ? tx.miktar : -tx.miktar);
  }

  tx.reverted = true;
  db.ref('transactions/' + id + '/reverted').set(true);

  transactions.unshift(ters);
  saveCache();

  const q = getQueue();
  q.push(ters);
  setQueue(q);
  updateOfflineBar();
  trySyncQueue();
  render();
}

function round2(n) { return Math.round(n * 100) / 100; }

// ===== Service worker kaydi ve guncelleme akisi =====
let bekleyenSw = null;

function guncellemeyiUygula() {
  if (!bekleyenSw) { location.reload(); return; }
  bekleyenSw.postMessage('HEMEN_GEC');
}

async function guncellemeDenetle() {
  if (!('serviceWorker' in navigator)) { alert('Bu tarayıcı güncelleme denetimini desteklemiyor.'); return; }
  const kayit = await navigator.serviceWorker.getRegistration();
  if (!kayit) { alert('Uygulama henüz kurulmamış.'); return; }
  await kayit.update();
  alert(bekleyenSw ? 'Yeni sürüm indirildi. Yenile düğmesine bas.' : 'Uygulama güncel.');
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then(kayit => {
      kayit.addEventListener('updatefound', () => {
        const yeni = kayit.installing;
        if (!yeni) return;
        yeni.addEventListener('statechange', () => {
          if (yeni.state === 'installed' && navigator.serviceWorker.controller) {
            bekleyenSw = yeni;
            document.getElementById('guncellemeBari').style.display = 'flex';
          }
        });
      });
    }).catch(e => console.warn('sw kaydedilemedi', e));

    let yenilendi = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (yenilendi) return;
      yenilendi = true;
      location.reload();
    });
  });
}
</script>
